<style>
  /* 봉투가 놓이는 무대 — 열리면 위로 공간이 생긴다 */
  .env-stage{--ew:min(80vw,300px);position:relative;height:calc(var(--ew) * .68);
    margin:6px auto 18px;transition:height 1.05s cubic-bezier(.16,1,.3,1)}
  
  .env{position:absolute;left:50%;bottom:0;width:var(--ew);height:calc(var(--ew) * .68);
    margin-left:calc(var(--ew) * -.5);cursor:pointer;perspective:1000px}
  .env-stage.open .env{cursor:default}
  .env:focus-visible{outline:3px solid var(--rose-deep);outline-offset:6px;border-radius:16px}
  /* 봉투 뒷판 */
  .back{position:absolute;left:0;top:0;right:0;bottom:0;z-index:1;border-radius:14px;
    background:linear-gradient(160deg,#ffdbe6,#ffb6cd);
    box-shadow:0 22px 44px -22px rgba(190,30,80,.55),inset 0 2px 0 rgba(255,255,255,.7)}
  /* 편지지 — 닫히면 바닥에 눌려 있고, 열리면 스르륵 올라온다 */
  .paper{position:absolute;left:7%;right:7%;bottom:14px;z-index:2;transform-origin:50% 100%;
    background:linear-gradient(#fffdf7,#fff7ee);border:1px solid #f4dccc;border-radius:12px;
    padding:20px 17px;text-align:left;font-family:var(--font-hand);color:#6b3a28;
    box-shadow:0 18px 36px -18px rgba(190,30,80,.5);
    transform:translateY(0) scaleY(.04);opacity:0;
    transition:transform 1.1s cubic-bezier(.16,1,.3,1),opacity .5s ease .18s}
  .env-stage.open .paper{transform:translateY(calc(-1 * var(--lift,150px))) scaleY(1);opacity:1}
  .paper .ln{margin:0 0 9px;font-size:clamp(16px,4.4vw,20px);line-height:1.55}
  .paper .ln:last-child{margin-bottom:0}
  .paper .sign{margin-top:14px;text-align:right;color:var(--rose-deep)}
  /* 봉투 앞주머니 (V자 클립) */
  .front{position:absolute;left:0;top:0;right:0;bottom:0;z-index:3;border-radius:14px;
    background:linear-gradient(#ffcada,#ff9fbb);
    -webkit-clip-path:polygon(0 0,50% 46%,100% 0,100% 100%,0 100%);
    clip-path:polygon(0 0,50% 46%,100% 0,100% 100%,0 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.55)}
  /* 봉투 뚜껑 */
  .flap{position:absolute;left:0;top:0;right:0;height:48%;z-index:4;transform-origin:50% 0;
    background:linear-gradient(#ffd6e3,#ffb9cf);border-radius:14px 14px 0 0;
    -webkit-clip-path:polygon(0 0,100% 0,50% 100%);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transition:transform .9s cubic-bezier(.5,.02,.2,1)}
  .env-stage.open .flap{transform:rotateX(-168deg)}
  .env-stage.flipped .flap{z-index:1}
  .seal{position:absolute;left:50%;top:58%;width:40px;height:40px;margin-left:-20px;
    display:grid;place-items:center;font-size:24px;transition:opacity .35s;
    filter:drop-shadow(0 2px 3px rgba(190,30,80,.4))}
  .env-stage.open .seal{opacity:0}
  .tap{position:absolute;left:0;right:0;bottom:9%;z-index:5;text-align:center;
    font-family:var(--font-hand);font-size:15px;color:#fff;
    text-shadow:0 1px 3px rgba(190,30,80,.5);
    animation:nudge 2.4s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .env-stage.open .tap{opacity:0;transition:opacity .3s}
  #fold{display:none;margin-top:6px}
</style>

<div class="stage">
  <main class="card">
    <span class="emoji">💌</span>
    <h1>편지 왔어요</h1>
    <p class="sub">봉투를 톡 눌러봐 ✉️</p>

    <div class="env-stage" id="estage">
      <div class="env" id="env" role="button" tabindex="0" aria-label="봉투 열기">
        <div class="back"></div>
        <div class="paper" id="paper"></div>
        <div class="front"></div>
        <div class="flap">
          <div class="seal">💗</div>
        </div>
        <div class="tap">여기 톡 👆</div>
      </div>
    </div>

    <button class="btn-ghost" id="fold" type="button">다시 접기 🤍</button>
    <div class="note" id="note"></div>
  </main>
</div>

<script src="../assets/fx.js?v=3"></script>
<script>
(function(){
  /* ───────── 여기만 고치면 됩니다 ───────── */
  var LINES = [        // ← 편지 본문 (한 줄씩, 원하는 만큼 늘리거나 줄여도 됨)
    "자기에게",
    "요즘 정신없이 지나가는 하루하루인데,",
    "그 사이에 네가 챙겨준 게 참 많더라.",
    "말로는 잘 못 하니까 이렇게 적어둘게.",
    "같이 밥 먹고 시시한 얘기 하는 시간이",
    "나한텐 제일 좋은 시간이야.",
    "오늘도 고마워. 내일도 잘 부탁해 💕"
  ];
  var SIGN = "— 언제나 네 편, 남편 🤍";  // ← 편지 끝 서명
  /* ────────────────────────────────────── */

  var estage = document.getElementById('estage');
  var env = document.getElementById('env');
  var paper = document.getElementById('paper');
  var fold = document.getElementById('fold');
  var note = document.getElementById('note');
  var opened = false;

  // 편지 본문 심기
  var i, p;
  for (i = 0; i < LINES.length; i++){
    p = document.createElement('p');
    p.className = 'ln';
    p.textContent = LINES[i];
    paper.appendChild(p);
  }
  if (SIGN){
    p = document.createElement('p');
    p.className = 'ln sign';
    p.textContent = SIGN;
    paper.appendChild(p);
  }

  function openEnv(){
    if (opened) return;
    opened = true;
    // 편지지 실제 높이를 재서, 무대 높이와 올라올 거리를 함께 계산한다
    // (고정값을 쓰면 편지가 길 때 카드 밖으로 튀어나가 잘린다)
    var ph = paper.scrollHeight || 200;
    var envH = estage.querySelector('.env').offsetHeight || 200;
    var lift = Math.round(envH * 0.58);
    estage.style.setProperty('--lift', lift + 'px');
    estage.style.height = (14 + lift + ph + 12) + 'px';
    estage.classList.add('open');
    note.textContent = '스르륵…';
    // 뚜껑이 뒤로 넘어간 뒤 편지지보다 뒤에 두기
    setTimeout(function(){ estage.classList.add('flipped'); }, 430);
    setTimeout(function(){
      note.textContent = '천천히 읽어 💕';
      fold.style.display = 'inline-block';
      var r = paper.getBoundingClientRect();
      FX.burst(r.left + r.width / 2, r.top + 40, 70);
      for (var k = 0; k < 7; k++) setTimeout(FX.heart, k * 170);
      setTimeout(function(){
        FX.burst(window.innerWidth * .5, window.innerHeight * .34, 45);
      }, 600);
    }, 1200);
  }

  function foldBack(){
    opened = false;
    estage.style.height = '';
    estage.style.removeProperty('--lift');
    estage.classList.remove('open');
    estage.classList.remove('flipped');
    fold.style.display = 'none';
    note.textContent = '';
  }

  env.addEventListener('click', openEnv);
  env.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
      e.preventDefault();
      openEnv();
    }
  });
  fold.addEventListener('click', foldBack);
})();
</script>
