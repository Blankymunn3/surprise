<style>
  .card{width:min(96vw,640px)}
  .wrapmap{position:relative;background:#fff;border-radius:22px;border:1px solid rgba(255,255,255,.9);
    box-shadow:0 18px 40px -20px rgba(190,30,80,.45);overflow:hidden;margin:6px 0 12px;touch-action:none}
  svg#kr{display:block;width:100%;height:min(58vh,440px);background:#fff;cursor:grab}
  svg#kr.drag{cursor:grabbing}
  .rg{fill:#f4f5f7;stroke:#c9ccd3;stroke-width:.6;transition:fill .2s}
  .rg:hover{fill:#ffe3ee}
  .rg.done{stroke:#e11d5b;stroke-width:.9}
  .rg.sel{stroke:#e11d5b;stroke-width:1.8}
  .tools{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:2px 0 10px}
  .tools .btn-ghost{font-size:14px;padding:9px 15px}
  .prog{font-family:var(--font-hand);font-size:15px;color:var(--ink-soft);margin:0 0 8px}
  .prog b{color:var(--rose-deep);font-size:19px}
  .panel{background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.95);border-radius:18px;
    padding:13px 15px;margin-top:4px;display:none;align-items:center;gap:12px;text-align:left}
  .panel.show{display:flex}
  .panel .th{width:54px;height:54px;flex:none;border-radius:13px;background:#ffe3ee;display:grid;place-items:center;
    font-size:23px;background-size:cover;background-position:center;overflow:hidden}
  .panel .nm{font-size:17px;color:var(--rose-deep)}
  .panel .st{font-family:var(--font-hand);font-size:13px;color:var(--ink-soft)}
  .panel .acts{margin-left:auto;display:flex;flex-direction:column;gap:5px}
  .mini{font-family:var(--font);font-size:12px;border:1px solid #ffc2d6;background:#fff;color:var(--rose-deep);
    border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
  .mini:hover{background:var(--rose);color:#fff}
  .mini.del{color:#96566f;border-color:#e9d3dc}
  .hidden{display:none}
  .loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-hand);
    color:var(--ink-soft);background:#fff}
</style>

<a class="home" href="../">← 목록</a>

<div class="stage">
  <main class="card">
    <span class="emoji">🇰🇷</span>
    <h1>우리 도장깨기 지도</h1>
    <p class="sub">가본 지역을 눌러 사진을 넣으면 그 지역이 사진으로 채워져 📸</p>

    <p class="prog" id="prog">불러오는 중…</p>

    <div class="tools">
      <button class="btn-ghost" id="all" type="button">전국</button>
      <button class="btn-ghost" id="metro" type="button">수도권</button>
      <button class="btn-ghost" id="zin" type="button">＋</button>
      <button class="btn-ghost" id="zout" type="button">－</button>
    </div>

    <div class="wrapmap">
      <svg id="kr" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="대한민국 시군구 지도"></svg>
      <div class="loading" id="loading">지도 불러오는 중… 🗺️</div>
    </div>

    <div class="panel" id="panel">
      <div class="th" id="pth"><span>📍</span></div>
      <div>
        <div class="nm" id="pnm">지역</div>
        <div class="st" id="pst"></div>
      </div>
      <div class="acts">
        <button class="mini" id="ppick" type="button">사진 넣기</button>
        <button class="mini del hidden" id="pdel" type="button">지우기</button>
      </div>
    </div>

    <div class="note" id="note">사이트에 올린 사진은 자기야 폰에서도 보여요</div>
    <input type="file" id="picker" accept="image/*" class="hidden" />
  </main>
</div>

<script src="../assets/fx.js"></script>
<script>
(function(){
  var GEO='https://cdn.jsdelivr.net/gh/southkorea/southkorea-maps@master/kostat/2013/json/skorea_municipalities_geo_simple.json';
  var KEY='surprise.stamp.';
  /* 사이트에 사진을 올려둔 지역 코드 (photos/region-<code>.jpg) — 모든 기기에서 보임 */
  var SITE_CODES=['11140','11160','11230','32030'];
  /* 우리 추억 메모 */
  var MEMO={'11140':'처음 만난 곳 💘','11160':'첫 데이트 · 서울식물원 🌿','11230':'프로포즈 💍','32030':'강릉 여행 🌅'};

  var svg=document.getElementById('kr'), loading=document.getElementById('loading');
  var prog=document.getElementById('prog'), note=document.getElementById('note');
  var panel=document.getElementById('panel'), pth=document.getElementById('pth');
  var pnm=document.getElementById('pnm'), pst=document.getElementById('pst');
  var picker=document.getElementById('picker');
  var NS='http://www.w3.org/2000/svg';

  var regions=[], byCode={}, sitePhotos={}, sel=null, defs=null;
  var VB={x:0,y:0,w:100,h:100}, HOME=null, META=null;

  function localPhoto(c){ try{ return localStorage.getItem(KEY+c); }catch(e){ return null; } }
  function photoOf(c){ return localPhoto(c) || sitePhotos[c] || null; }

  function setVB(v){ VB=v; svg.setAttribute('viewBox', v.x+' '+v.y+' '+v.w+' '+v.h); }

  fetch(GEO).then(function(r){ return r.json(); }).then(build).catch(function(){
    loading.textContent='지도를 불러오지 못했어요. 인터넷 확인 후 새로고침 🙏';
  });

  function build(geo){
    var feats=geo.features, minLon=1e9,maxLon=-1e9,minLat=1e9,maxLat=-1e9;
    function each(g,cb){
      if(g.type==='Polygon') g.coordinates.forEach(function(r){ cb(r); });
      else g.coordinates.forEach(function(p){ p.forEach(function(r){ cb(r); }); });
    }
    feats.forEach(function(f){ each(f.geometry,function(ring){
      ring.forEach(function(c){
        if(c[0]<minLon)minLon=c[0]; if(c[0]>maxLon)maxLon=c[0];
        if(c[1]<minLat)minLat=c[1]; if(c[1]>maxLat)maxLat=c[1];
      });
    });});
    var mx0=1e9,mx1=-1e9,my0=1e9,my1=-1e9;   // 수도권 범위
    var midLat=(minLat+maxLat)/2, kx=Math.cos(midLat*Math.PI/180);
    var W=1000, H=Math.round(W*((maxLat-minLat)/((maxLon-minLon)*kx)));
    function px(c){ return [ (c[0]-minLon)*kx/((maxLon-minLon)*kx)*W, (maxLat-c[1])/(maxLat-minLat)*H ]; }

    defs=document.createElementNS(NS,'defs'); svg.appendChild(defs);

    feats.forEach(function(f){
      var d='';
      each(f.geometry,function(ring){
        ring.forEach(function(c,i){ var p=px(c); d+=(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); });
        d+='Z';
      });
      var code=f.properties.code, name=f.properties.name;
      var path=document.createElementNS(NS,'path');
      path.setAttribute('d',d); path.setAttribute('class','rg');
      path.setAttribute('data-code',code);
      var t=document.createElementNS(NS,'title'); t.textContent=name; path.appendChild(t);
      path.addEventListener('click',function(){ select(code); });
      svg.appendChild(path);
      var o={code:code,name:name,el:path};
      regions.push(o); byCode[code]=o;
      // 수도권(서울11·인천23·경기31) 범위 누적
      var pre=code.substring(0,2);
      if(pre==='11'){
        each(f.geometry,function(ring){
          ring.forEach(function(c){
            var q=px(c);
            if(q[0]<mx0)mx0=q[0]; if(q[0]>mx1)mx1=q[0];
            if(q[1]<my0)my0=q[1]; if(q[1]>my1)my1=q[1];
          });
        });
      }
    });

    HOME={x:0,y:0,w:W,h:H};
    var pad=(mx1-mx0)*0.55;
    META={x:mx0-pad, y:my0-pad, w:(mx1-mx0)+pad*2, h:(my1-my0)+pad*2};
    setVB(HOME);
    loading.style.display='none';
    loadSitePhotos(function(){ regions.forEach(function(r){ paint(r); }); updateProg(); });
    updateProg();
  }

  /* 사이트에 올려둔 사진 불러오기 */
  function loadSitePhotos(done){
    var left=SITE_CODES.length;
    if(!left){ done(); return; }
    SITE_CODES.forEach(function(c){
      var url='../photos/region-'+c+'.jpg', im=new Image();
      im.onload=function(){ sitePhotos[c]=url; if(--left===0) done(); };
      im.onerror=function(){ if(--left===0) done(); };
      im.src=url;
    });
  }

  /* 지역을 사진으로 채우기 (SVG pattern) */
  function paint(r){
    var src=photoOf(r.code);
    var id='pat-'+r.code, old=document.getElementById(id);
    if(!src){
      if(old) old.parentNode.removeChild(old);
      r.el.style.fill=''; r.el.removeAttribute('fill'); r.el.classList.remove('done');
      return;
    }
    if(old) old.parentNode.removeChild(old);
    var bb=r.el.getBBox();
    if(!bb.width||!bb.height) return;
    var pat=document.createElementNS(NS,'pattern');
    pat.setAttribute('id',id);
    pat.setAttribute('patternUnits','userSpaceOnUse');
    pat.setAttribute('x',bb.x); pat.setAttribute('y',bb.y);
    pat.setAttribute('width',bb.width); pat.setAttribute('height',bb.height);
    var im=document.createElementNS(NS,'image');
    im.setAttribute('href',src);
    im.setAttributeNS('http://www.w3.org/1999/xlink','xlink:href',src);
    im.setAttribute('x','0'); im.setAttribute('y','0');   // 패턴 내부 좌표는 타일 로컬 기준
    im.setAttribute('width',bb.width); im.setAttribute('height',bb.height);
    im.setAttribute('preserveAspectRatio','xMidYMid slice');
    pat.appendChild(im); defs.appendChild(pat);
    r.el.style.fill='url(#'+id+')';
    r.el.classList.add('done');
  }

  function updateProg(){
    var n=0;
    regions.forEach(function(r){ if(photoOf(r.code)) n++; });
    prog.innerHTML='전국 '+regions.length+'곳 중 <b>'+n+'곳</b> 도장 깼어 💗';
  }

  function select(code){
    var r=byCode[code]; if(!r) return;
    regions.forEach(function(x){ x.el.classList.remove('sel'); });
    r.el.classList.add('sel');
    sel=r;
    pnm.textContent=r.name;
    pst.textContent=MEMO[code] || (photoOf(code)?'우리 추억이 담긴 곳':'아직 사진이 없어');
    var src=photoOf(code);
    pth.style.backgroundImage=src?('url('+src+')'):'';
    pth.innerHTML=src?'':'<span>📍</span>';
    document.getElementById('pdel').className='mini del'+(localPhoto(code)?'':' hidden');
    document.getElementById('ppick').textContent=src?'사진 바꾸기':'사진 넣기';
    panel.classList.add('show');
  }

  document.getElementById('ppick').addEventListener('click',function(){
    if(!sel) return; picker.value=''; picker.click();
  });
  document.getElementById('pdel').addEventListener('click',function(){
    if(!sel) return;
    try{ localStorage.removeItem(KEY+sel.code); }catch(e){}
    paint(sel); updateProg(); select(sel.code);
    note.textContent=sel.name+' 사진을 지웠어';
  });

  picker.addEventListener('change',function(){
    var f=picker.files&&picker.files[0]; if(!f||!sel) return;
    var r=sel, rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var max=720,w=im.width,h=im.height;
        if(w>h&&w>max){ h=Math.round(h*max/w); w=max; }
        else if(h>=w&&h>max){ w=Math.round(w*max/h); h=max; }
        var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(im,0,0,w,h);
        try{
          localStorage.setItem(KEY+r.code, cv.toDataURL('image/jpeg',0.7));
          paint(r); updateProg(); select(r.code);
          note.textContent=r.name+' 도장 깼다! 📸';
          var b=r.el.getBoundingClientRect();
          FX.burst(b.left+b.width/2, b.top+b.height/2, 60);
          for(var k=0;k<5;k++) setTimeout(FX.heart,k*130);
        }catch(e){ note.textContent='저장 공간이 부족해. 사진 하나 지우고 다시 해줘 🙏'; }
      };
      im.onerror=function(){ note.textContent='이 사진은 못 읽었어 🥲'; };
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  });

  /* 확대·축소·이동 */
  function zoom(k,cx,cy){
    if(!HOME) return;
    var nw=Math.max(HOME.w*0.04, Math.min(HOME.w*1.2, VB.w*k));
    var nh=nw*(VB.h/VB.w);
    if(cx===undefined){ cx=VB.x+VB.w/2; cy=VB.y+VB.h/2; }
    setVB({x:cx-(cx-VB.x)*(nw/VB.w), y:cy-(cy-VB.y)*(nh/VB.h), w:nw, h:nh});
  }
  document.getElementById('zin').addEventListener('click',function(){ zoom(0.7); });
  document.getElementById('zout').addEventListener('click',function(){ zoom(1/0.7); });
  document.getElementById('all').addEventListener('click',function(){ if(HOME) setVB(HOME); });
  document.getElementById('metro').addEventListener('click',function(){ if(META) setVB(META); });

  var dragging=false, lastX=0, lastY=0;
  function toSvg(e){
    var r=svg.getBoundingClientRect();
    return { x: VB.x + (e.clientX-r.left)/r.width*VB.w, y: VB.y + (e.clientY-r.top)/r.height*VB.h };
  }
  svg.addEventListener('pointerdown',function(e){ dragging=true; lastX=e.clientX; lastY=e.clientY; svg.classList.add('drag'); });
  window.addEventListener('pointerup',function(){ dragging=false; svg.classList.remove('drag'); });
  svg.addEventListener('pointermove',function(e){
    if(!dragging) return;
    var r=svg.getBoundingClientRect();
    var dx=(e.clientX-lastX)/r.width*VB.w, dy=(e.clientY-lastY)/r.height*VB.h;
    lastX=e.clientX; lastY=e.clientY;
    setVB({x:VB.x-dx,y:VB.y-dy,w:VB.w,h:VB.h});
  });
  svg.addEventListener('wheel',function(e){
    e.preventDefault();
    var p=toSvg(e);
    zoom(e.deltaY>0?1.12:0.89, p.x, p.y);
  },{passive:false});
})();
</script>
