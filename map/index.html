<style>
  .card{width:100%;max-width:640px}
  #map{height:min(60vh,460px);border-radius:22px;border:1px solid rgba(255,255,255,.9);
    box-shadow:0 18px 40px -20px rgba(190,30,80,.5);margin:4px 0 12px;background:#e9f1f4}
  .leaflet-container{font-family:var(--font)}
  .pinwrap{position:relative}
  .pin{width:46px;height:46px;border-radius:50%;border:3px solid #fff;overflow:hidden;
    background:linear-gradient(140deg,#ff8fab,#e11d5b);display:grid;place-items:center;
    box-shadow:0 8px 18px -6px rgba(190,30,80,.65);cursor:pointer;transition:transform .2s}
  .pin:hover{transform:scale(1.08)}
  .pin span{font-size:21px;line-height:1}
  .pin.has-photo{background-size:cover;background-position:center}
  .pin.has-photo span{display:none}
  .prog{font-family:var(--font-hand);font-size:15px;color:var(--ink-soft);margin:0 0 8px}
  .prog b{color:var(--rose-deep);font-size:19px}
  .bar{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:2px 0 10px}
  .bar .btn-ghost{font-size:13.5px;padding:9px 14px}
  /* 좁은 폰: 4+1로 어색하게 접히는 대신 3+2로 딱 맞게 */
  @media (max-width:430px){
    .bar{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
    .bar .btn-ghost{font-size:12.5px;padding:9px 4px;white-space:nowrap}
    .bar .btn-ghost:nth-child(-n+3){grid-column:span 2}
    .bar .btn-ghost:nth-child(n+4){grid-column:span 3}
  }
  /* 내 위치 버튼 (확대/축소 바로 아래, 왼쪽 하단) */
  .me-ctl{margin-top:6px !important}
  .me-ctl a{font-size:15px;line-height:30px !important;text-align:center;text-decoration:none}
  /* 지역 검색 — Leaflet 컨트롤(z-index 1000)보다 위에 떠야 결과가 가려지지 않음 */
  .search{position:relative;margin:0 0 10px;z-index:1200}
  .search input{width:100%;font-size:15px;text-align:left;padding:11px 38px 11px 14px;border-radius:14px}
  .search input::-webkit-search-cancel-button{display:none}
  .qclear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;
    color:var(--ink-soft);font-size:15px;cursor:pointer;padding:6px 8px;line-height:1}
  .qres{list-style:none;margin:6px 0 0;padding:6px;position:absolute;left:0;right:0;top:100%;
    background:rgba(255,255,255,.97);border:1px solid #ffdce7;border-radius:16px;text-align:left;
    box-shadow:0 18px 40px -18px rgba(190,30,80,.55);max-height:250px;overflow-y:auto;display:none}
  .qres.show{display:block}
  .qres li{padding:9px 12px;border-radius:11px;cursor:pointer;font-size:14.5px;color:var(--ink)}
  .qres li:hover,.qres li.on{background:#ffe3ee}
  .qres li .tag{font-family:var(--font-hand);font-size:12.5px;color:var(--ink-soft);margin-left:6px}
  .qres li .dot{color:var(--rose-deep);margin-left:5px}
  .qres .none{color:var(--ink-soft);font-family:var(--font-hand);cursor:default}
  .qres .none:hover{background:none}
  .panel{background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.95);border-radius:18px;
    padding:12px 14px;margin-top:4px;display:none;align-items:center;gap:12px;text-align:left}
  .panel.show{display:flex}
  .panel .th{width:52px;height:52px;flex:none;border-radius:13px;background:#ffe3ee;display:grid;place-items:center;
    font-size:23px;background-size:cover;background-position:center;overflow:hidden}
  .panel .nm{font-size:17px;color:var(--rose-deep)}
  .panel .st{font-family:var(--font-hand);font-size:13px;color:var(--ink-soft)}
  .panel .acts{margin-left:auto;display:flex;flex-direction:column;gap:5px}
  .mini{font-family:var(--font);font-size:12px;border:1px solid #ffc2d6;background:#fff;color:var(--rose-deep);
    border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
  .mini:hover{background:var(--rose);color:#fff}
  .mini.del{color:#96566f;border-color:#e9d3dc}
  .hidden{display:none}
  /* 클릭 시 브라우저 기본 사각형 포커스 링 제거 (지역 모양으로만 강조) */
  #map path{outline:none !important;}
  #map path:focus,#map path:focus-visible{outline:none !important;}
  .leaflet-interactive:focus{outline:none !important;}
</style>

<div class="stage">

    <p class="sub">국내·해외 어디든 눌러 사진을 넣어봐 📸 나라는 '시도 나누기'로 더 잘게!</p>

    <div class="search">

             placeholder="지역 이름으로 찾기 (예: 강릉, 일본)" />

<script>
(function(){
  var KEY='surprise.stamp.';          // 지역 코드별 사진 (도장깨기와 공용)
  var OLDKEY='surprise.map.photo.';   // 예전 장소별 사진 → 코드로 옮김
  var GEO='https://cdn.jsdelivr.net/gh/southkorea/southkorea-maps@master/kostat/2013/json/skorea_municipalities_geo_simple.json';
  var WORLD='https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries.geo.json';
  /* ISO 코드가 없는 지역(id 가 -99)용 이름.
     그 외 나라 이름은 assets/countries-ko.js 에서 ISO 코드로 찾습니다. */
  var KO_ALT={Kosovo:'코소보',Somaliland:'소말릴란드','Northern Cyprus':'북키프로스',
    'N. Cyprus':'북키프로스','West Bank':'요르단강 서안','Western Sahara':'서사하라',
    'W. Sahara':'서사하라','Republic of Serbia':'세르비아'};
  var SITE_CODES=[];   // photos/region-<code>.jpg 로 올려둔 지역

  /* 우리 추억 장소 (확정된 사실만) */
  var PLACES=[
    {id:'gongdeok', name:'공덕',      emoji:'💘', desc:'처음 만난 곳 (2023)',    lat:37.5445, lng:126.9516, code:'11140'},
    {id:'botanic',  name:'서울식물원', emoji:'🌿', desc:'사귀고 첫 데이트',        lat:37.5695, lng:126.8355, code:'11160'},
    {id:'gangnam',  name:'강남',      emoji:'💍', desc:"프로포즈 — 김동률 '감사'", lat:37.4979, lng:127.0276, code:'11230'},
    {id:'jeongdong',name:'정동진',    emoji:'🌅', desc:'2026년 여름 강릉 여행',   lat:37.6906, lng:129.0335, code:'32030'},
    {id:'bali',     name:'발리',      emoji:'🌴', desc:'신혼여행',               lat:-8.6500, lng:115.2167, code:'bali'}
  ];
  var MEMO={}; PLACES.forEach(function(p){ MEMO[p.code]=p.name+' · '+p.desc; });

  var mapEl=document.getElementById('map');
  if(typeof L==='undefined'){
    mapEl.innerHTML='<div style="padding:24px;font-family:var(--font-hand)">지도를 불러오지 못했어요. 인터넷 확인 후 새로고침 🙏</div>';
    return;
  }

  /* 확대/축소는 왼쪽 아래 (오른쪽 위는 검색 결과창과 겹침) */
  /* 세계를 한 번만 그리고 그 밖으로는 못 나가게. (기본값은 좌우로 계속 반복돼서 헷갈림)
     위아래 ±85도는 웹 지도(메르카토르)가 그릴 수 있는 한계입니다. */
  var WORLD_BOUNDS=L.latLngBounds([[-85,-180],[85,180]]);
  var map=L.map('map',{zoomControl:false,scrollWheelZoom:false,
    worldCopyJump:false, maxBounds:WORLD_BOUNDS, maxBoundsViscosity:1, minZoom:1});
  L.control.zoom({position:'bottomleft',zoomInTitle:'확대',zoomOutTitle:'축소'}).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19,noWrap:true,bounds:WORLD_BOUNDS,attribution:'&copy; OpenStreetMap'}).addTo(map);

  /* 마우스가 지도 위에 있을 때만 휠 확대/축소
     (항상 켜두면 페이지를 스크롤하다가 지도에서 걸림) */
  mapEl.addEventListener('mouseenter',function(){ map.scrollWheelZoom.enable(); });
  mapEl.addEventListener('mouseleave',function(){ map.scrollWheelZoom.disable(); });

  var layers={}, names={}, baliOverlay=null, sitePhotos={}, sel=null, total=0, showBorders=true;
  /* 클라우드(Firebase Storage) 사진 — 설정 전이면 그냥 비어 있고 예전처럼 기기에만 저장됨 */
  var CLOUD=!!(window.CloudPhotos && CloudPhotos.configured);
  var cloud=CLOUD?CloudPhotos.cached():{};
  function CK(c){ return CLOUD?CloudPhotos.key(c):c; }
  var picker=document.getElementById('picker'), note=document.getElementById('note');
  var panel=document.getElementById('panel'), pth=document.getElementById('pth');
  var pnm=document.getElementById('pnm'), pst=document.getElementById('pst');
  var prog=document.getElementById('prog');
  var group=L.layerGroup().addTo(map);

  /* 예전 장소별 사진을 지역 코드로 이전 */
  (function migrate(){
    try{
      PLACES.forEach(function(p){
        var old=localStorage.getItem(OLDKEY+p.id);
        if(old && !localStorage.getItem(KEY+p.code)){ localStorage.setItem(KEY+p.code, old); }
        if(old) localStorage.removeItem(OLDKEY+p.id);
      });
    }catch(e){}
  })();

  function localPhoto(c){ try{ return localStorage.getItem(KEY+c); }catch(e){ return null; } }
  function cloudPhoto(c){ return cloud[CK(c)] || null; }
  /* 클라우드 → 이 기기 → 사이트에 올려둔 사진 순으로 */
  function photoOf(c){ return cloudPhoto(c) || localPhoto(c) || sitePhotos[c] || null; }

  function loadSitePhotos(done){
    var left=SITE_CODES.length; if(!left){ done(); return; }
    SITE_CODES.forEach(function(c){
      var url='../photos/region-'+c+'.jpg', im=new Image();
      im.onload=function(){ sitePhotos[c]=url; if(--left===0) done(); };
      im.onerror=function(){ if(--left===0) done(); };
      im.src=url;
    });
  }

  /* 사진을 지역 모양대로 꽉 채워 크롭 */
  function patternFill(path, code, src){
    var svg=path.ownerSVGElement; if(!svg) return;
    var NS='http://www.w3.org/2000/svg';
    var defs=svg.querySelector('defs');
    if(!defs){ defs=document.createElementNS(NS,'defs'); svg.insertBefore(defs, svg.firstChild); }
    var pid='dpat-'+code, old=document.getElementById(pid);
    if(old) old.parentNode.removeChild(old);
    var pat=document.createElementNS(NS,'pattern');
    pat.setAttribute('id',pid);
    pat.setAttribute('patternUnits','objectBoundingBox');
    pat.setAttribute('patternContentUnits','objectBoundingBox');
    pat.setAttribute('width','1'); pat.setAttribute('height','1');
    var im=document.createElementNS(NS,'image');
    im.setAttribute('href',src);
    im.setAttributeNS('http://www.w3.org/1999/xlink','xlink:href',src);
    im.setAttribute('x','0'); im.setAttribute('y','0');
    im.setAttribute('width','1'); im.setAttribute('height','1');
    im.setAttribute('preserveAspectRatio','xMidYMid slice');
    pat.appendChild(im); defs.appendChild(pat);
    path.style.fill='url(#'+pid+')';
    path.style.fillOpacity='1';
  }

  function styleFor(code){
    var has=!!photoOf(code);
    var isSel=sel&&sel.code===code;
    return { color: isSel?'#e11d5b':(has?'#e11d5b':'#b9c0c8'),
             weight: isSel?3.5:(has?2:(showBorders?0.7:0)),
             opacity: (showBorders||has||isSel)?0.98:0,
             fillColor: isSel?'#ffd9e5':'#ffffff',
             fillOpacity: has?1:(isSel?0.55:(showBorders?0.25:0)),
             dashArray: isSel&&!has?'6 4':null };
  }

  function paint(code){
    var lyr=layers[code]; if(!lyr) return;
    lyr.setStyle(styleFor(code));
    var src=photoOf(code);
    if(src && lyr._path) patternFill(lyr._path, code, src);
    else if(lyr._path){ lyr._path.style.fill=''; lyr._path.style.fillOpacity=''; }
  }

  function updateProg(){
    var kr=0, ov=0, pv=0;
    for(var c in layers){
      if(!photoOf(c)) continue;
      if(c.indexOf('C-')===0) ov++;           // 나라 전체
      else if(c.indexOf('P-')===0) pv++;      // 해외 시도(주) — 나라로 세면 안 됨
      else kr++;                              // 국내 시군구
    }
    var s='국내 <b>'+kr+'곳</b>';
    if(ov) s+=' · 해외 <b>'+ov+'개국</b>';
    if(pv) s+=(ov?' ':' · 해외 ')+'<b>'+pv+'개 지역</b>';
    prog.innerHTML=s+' 도장 깼어 💗';
  }

  function select(code,name){
    var prev=sel&&sel.code;
    sel={code:code,name:name};
    if(prev&&layers[prev]) layers[prev].setStyle(styleFor(prev));
    if(layers[code]) layers[code].setStyle(styleFor(code));
    pnm.textContent=name;
    pst.textContent=MEMO[code] || (photoOf(code)?'우리 추억이 담긴 곳':'아직 사진이 없어');
    var src=photoOf(code);
    pth.style.backgroundImage=src?('url('+src+')'):'';
    pth.innerHTML=src?'':'<span>📍</span>';
    document.getElementById('pdel').className='mini del'+((localPhoto(code)||cloudPhoto(code))?'':' hidden');
    document.getElementById('ppick').textContent=src?'사진 바꾸기':'사진 넣기';
    var sp=document.getElementById('psplit');
    var isCountry=code.indexOf('C-')===0 && !(layers[code]&&layers[code]._split);
    sp.className='mini'+(isCountry?'':' hidden');
    panel.classList.add('show');
  }

  /* 지역을 눌렀을 때 그 지역이 화면에 꽉 차게 줌인
     (사진 갱신·복원 때는 부르지 않고, 사용자가 직접 누른 경우에만) */
  function zoomTo(code){
    var lyr=layers[code];
    if(lyr && lyr.getBounds){
      try{
        var b=lyr.getBounds();
        if(b && b.isValid()){ map.flyToBounds(b,{padding:[26,26],maxZoom:12,duration:.6}); return; }
      }catch(e){}
    }
    /* 경계가 없는 곳(발리 등)은 좌표로 */
    var p=PLACES.filter(function(x){ return x.code===code; })[0];
    if(p) map.flyTo([p.lat,p.lng],10,{duration:.6});
  }

  function pick(code,name){ select(code,name); zoomTo(code); }

  /* ── 지역 검색 ─────────────────────────────────────────────────
     지도에 올라온 이름(국내 시군구·나라·해외 시도)과 추억 메모를 함께 찾습니다.
     그래서 '공덕'처럼 메모에만 있는 말로도 찾아집니다. */
  var q=document.getElementById('q'), qres=document.getElementById('qres');
  var qclear=document.getElementById('qclear'), hits=[], cur=-1;

  function kindOf(code){
    if(code.indexOf('P-')===0){                       // P-JPN-12 → 그 나라 이름으로
      var iso=code.slice(2).split('-')[0];
      return names['C-'+iso] || (window.COUNTRY_KO && COUNTRY_KO[iso]) || '해외 시도';
    }
    if(code.indexOf('C-')===0) return '나라';
    return /^\d+$/.test(code) ? '국내' : '우리 추억';   // 발리처럼 경계 없는 곳
  }

  function search(v){
    v=(v||'').trim().toLowerCase();
    if(!v) return [];
    var out=[], seen={};
    function add(code,name){
      if(seen[code] || !name) return;
      var nm=name.toLowerCase(), i=nm.indexOf(v);
      var rank = i===0 ? 0 : (i>0 ? 1 : ((MEMO[code]||'').toLowerCase().indexOf(v)>=0 ? 2 : -1));
      if(rank<0) return;
      seen[code]=1;
      out.push({code:code,name:name,rank:rank,photo:!!photoOf(code)});
    }
    for(var c in names) add(c,names[c]);
    PLACES.forEach(function(p){ add(p.code,p.name); });   // 발리처럼 경계가 없는 곳
    out.sort(function(a,b){
      if(a.rank!==b.rank) return a.rank-b.rank;           // 이름 앞부분 일치 우선
      if(a.photo!==b.photo) return a.photo?-1:1;          // 사진 있는 곳 우선
      return a.name.length-b.name.length;
    });
    return out.slice(0,8);
  }

  function closeRes(){ qres.classList.remove('show'); cur=-1; }

  function renderRes(){
    qres.innerHTML='';
    if(!hits.length){
      if((q.value||'').trim()){
        var no=document.createElement('li');
        no.className='none'; no.textContent='그런 지역은 못 찾았어 🥲';
        qres.appendChild(no); qres.classList.add('show');
      } else closeRes();
      return;
    }
    hits.forEach(function(h,i){
      var li=document.createElement('li');
      li.appendChild(document.createTextNode(h.name));    // 이름은 텍스트로만 (지도 데이터 그대로 신뢰하지 않음)
      var t=document.createElement('span'); t.className='tag'; t.textContent=kindOf(h.code); li.appendChild(t);
      if(h.photo){ var d=document.createElement('span'); d.className='dot'; d.textContent='📸'; li.appendChild(d); }
      if(i===cur) li.className='on';
      li.addEventListener('click',function(){ choose(h); });
      qres.appendChild(li);
    });
    qres.classList.add('show');
  }

  function choose(h){
    q.value=h.name;
    qclear.className='qclear';
    closeRes(); q.blur();
    pick(h.code,h.name);
  }

  q.addEventListener('input',function(){
    qclear.className='qclear'+(q.value?'':' hidden');
    hits=search(q.value); cur=-1; renderRes();
  });
  q.addEventListener('focus',function(){ if(hits.length) qres.classList.add('show'); });
  q.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      if(!hits.length) return;
      e.preventDefault();
      cur=(cur+(e.key==='ArrowDown'?1:hits.length-1)+hits.length)%hits.length;
      renderRes();
    } else if(e.key==='Enter'){
      if(hits.length) choose(hits[cur<0?0:cur]);
    } else if(e.key==='Escape'){ closeRes(); }
  });
  qclear.addEventListener('click',function(){
    q.value=''; hits=[]; qclear.className='qclear hidden'; closeRes(); q.focus();
  });
  document.addEventListener('click',function(e){
    if(!(e.target.closest && e.target.closest('.search'))) closeRes();
  });

  /* ── 내 위치 ───────────────────────────────────────────── */
  var meDot=null;
  function goMe(){
    if(!navigator.geolocation){ note.textContent='이 브라우저는 위치를 알려주지 못해 🥲'; return; }
    note.textContent='내 위치 찾는 중… 📍';
    navigator.geolocation.getCurrentPosition(function(pos){
      var ll=[pos.coords.latitude,pos.coords.longitude];
      if(meDot) map.removeLayer(meDot);
      meDot=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,
        fillColor:'#e11d5b',fillOpacity:1,interactive:false}).addTo(map);
      map.flyTo(ll,13,{duration:.8});
      note.textContent='여기 있네! 📍';
    },function(err){
      note.textContent = (err && err.code===1)
        ? '위치 권한을 켜줘야 찾을 수 있어 🙏'
        : '위치를 못 찾았어 🥲';
    },{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
  }

  var meCtl=L.control({position:'bottomleft'});
  meCtl.onAdd=function(){
    var box=L.DomUtil.create('div','leaflet-bar me-ctl');
    var a=L.DomUtil.create('a','',box);
    a.href='#'; a.title='내 위치'; a.setAttribute('role','button'); a.textContent='📍';
    L.DomEvent.on(a,'click',function(e){ L.DomEvent.stop(e); goMe(); });
    L.DomEvent.disableClickPropagation(box);
    return box;
  };
  meCtl.addTo(map);

  function drawBali(){
    if(baliOverlay){ map.removeLayer(baliOverlay); baliOverlay=null; }
    var src=photoOf('bali'); if(!src) return;
    var d=0.09;
    baliOverlay=L.imageOverlay(src,[[-8.65-d,115.2167-d*1.25],[-8.65+d,115.2167+d*1.25]],
      {opacity:.9,interactive:false}).addTo(map);
  }

  function repaintAll(){
    for(var c in layers) paint(c);
    drawBali(); updateProg();
    if(sel) select(sel.code, sel.name);
  }

  /* 클라우드에 올라와 있는 사진 목록 받아오기 (실패해도 기존 사진은 그대로) */
  function syncCloud(){
    if(!CLOUD) return;
    CloudPhotos.list().then(function(found){
      cloud=found; repaintAll();
    }).catch(function(){});
  }

  /* 시군구 경계 불러오기 */
  fetch(GEO).then(function(r){ return r.json(); }).then(function(geo){
    total=geo.features.length;
    geo.features.forEach(function(f){
      var code=f.properties.code, name=f.properties.name;
      names[code]=name;
      var lyr=L.geoJSON(f,{style:styleFor(code)}).getLayers()[0];
      lyr.on('click',function(){ pick(code,name); });
      lyr.bindTooltip(MEMO[code]? (name+' · '+PLACES.filter(function(x){return x.code===code;})[0].desc) : name, {sticky:true});
      lyr.addTo(group);
      layers[code]=lyr;
    });
    loadSitePhotos(function(){
      for(var c in layers) if(photoOf(c)) paint(c);
      drawBali(); updateProg();
    });
    for(var c in layers) if(photoOf(c)) paint(c);
    drawBali(); updateProg(); fitKr();
  }).catch(function(){
    prog.textContent='지역 경계를 불러오지 못했어요 (핀은 그대로 써도 돼요)';
    loadSitePhotos(function(){ drawBali(); });
  });

  /* ── 해외: 나라를 시도(주) 단위로 나누기 ───────────────────────── */
  var ADM1_SHA='9469f09592ced973a3448cf66b6100b741b64c0d';
  var EXP_KEY='surprise.map.expanded';
  var expanded={}, loading={};   // 나라별로 따로 관리 (새로고침 때 여러 나라를 동시에 복원해야 함)
  try{ expanded=JSON.parse(localStorage.getItem(EXP_KEY)||'{}')||{}; }catch(e){ expanded={}; }

  /* 시도 한글 이름표는 110KB 가 넘어서, '시도 나누기'를 누를 때 한 번만 받습니다.
     못 받아도 원본 이름으로 그냥 진행합니다. */
  var koLoading=null;
  function loadSubdivKo(){
    if(window.SUBDIV_KO) return Promise.resolve();
    if(koLoading) return koLoading;
    koLoading=new Promise(function(done){
      var s=document.createElement('script');
      s.src='../assets/subdivisions-ko.js?v=4';
      s.onload=function(){ done(); };
      s.onerror=function(){ done(); };
      document.head.appendChild(s);
    });
    return koLoading;
  }

  /* 나라별로 쓸 행정 단계. 기본은 ADM1.
     이탈리아는 ADM1 이 5개 광역권(북서부·남부…)뿐이라 실제 20개 주가 있는 ADM2 를 씁니다. */
  var ADM_LEVEL={ITA:'ADM2'};

  function adm1Url(iso){
    var lv=ADM_LEVEL[iso]||'ADM1';
    return 'https://media.githubusercontent.com/media/wmgeolab/geoBoundaries/'+ADM1_SHA+
           '/releaseData/gbOpen/'+iso+'/'+lv+'/geoBoundaries-'+iso+'-'+lv+'_simplified.geojson';
  }

  function splitCountry(iso, label){
    if(loading[iso]) return;                                  // 같은 나라 중복 요청만 차단
    if(layers['C-'+iso] && layers['C-'+iso]._split) return;
    loading[iso]=1;
    note.textContent=(label||iso)+' 시도 불러오는 중… 🧩';
    Promise.all([
      fetch(adm1Url(iso)).then(function(r){ if(!r.ok) throw 0; return r.json(); }),
      loadSubdivKo()
    ]).then(function(res){
      var g=res[0];
      var country=layers['C-'+iso];
      if(country){ group.removeLayer(country); country._split=true; }
      (g.features||[]).forEach(function(f,i){
        var pr=f.properties||{};
        var raw=pr.shapeName||pr.name||(iso+' '+(i+1));
        /* 한글 이름표(assets/subdivisions-ko.js)에 있으면 한글로, 없으면 원본 그대로 */
        var nm=(window.SUBDIV_KO_NAME && SUBDIV_KO_NAME[raw])
               || (pr.shapeISO && window.SUBDIV_KO && SUBDIV_KO[pr.shapeISO])
               || raw;
        var code='P-'+iso+'-'+i;
        names[code]=nm;
        var lyr=L.geoJSON(f,{style:styleFor(code)}).getLayers()[0];
        lyr.on('click',function(){ pick(code,nm); });
        lyr.bindTooltip(nm,{sticky:true});
        lyr.addTo(group);
        layers[code]=lyr;
        if(photoOf(code)) paint(code);
      });
      expanded[iso]=1;
      try{ localStorage.setItem(EXP_KEY, JSON.stringify(expanded)); }catch(e){}
      note.textContent=(label||iso)+' 시도로 나눴어! 이제 지역별로 사진을 넣을 수 있어 🧩';
      updateProg(); delete loading[iso];
      /* 지금 그 나라를 보고 있을 때만 패널 갱신 (다른 나라 복원 중에 버튼이 사라지지 않게) */
      if(sel && sel.code==='C-'+iso) select(sel.code, sel.name);
    }).catch(function(){
      note.textContent=(label||iso)+' 시도 정보를 못 찾았어 🥲 (나라 전체로는 채울 수 있어)';
      delete loading[iso];
    });
  }

  document.getElementById('psplit').addEventListener('click', function(){
    if(!sel || sel.code.indexOf('C-')!==0) return;
    splitCountry(sel.code.slice(2), sel.name);
  });

  /* 해외 국가 경계 */
  fetch(WORLD).then(function(r){ return r.json(); }).then(function(w){
    w.features.forEach(function(f){
      var iso=(f.id && f.id!=='-99') ? f.id : null;  // -99 = ISO 코드가 없는 지역(코소보 등)
      if(iso==='KOR') return;                        // 한국은 시군구 레이어로 대체
      var code='C-'+(iso||f.properties.name);
      var name=(iso && window.COUNTRY_KO && COUNTRY_KO[iso])
               || KO_ALT[f.properties.name] || f.properties.name;
      names[code]=name;
      var lyr=L.geoJSON(f,{style:styleFor(code)}).getLayers()[0];
      lyr.on('click',function(){ pick(code,name); });
      lyr.bindTooltip(name,{sticky:true});
      lyr.addTo(group);
      layers[code]=lyr;
      if(photoOf(code)) paint(code);
    });
    updateProg();
    for(var iso in expanded){ if(layers['C-'+iso]) splitCountry(iso, names['C-'+iso]); }
  }).catch(function(){});

  map.on('zoomend', function(){
    for(var c in layers){ if(photoOf(c) && layers[c]._path) patternFill(layers[c]._path, c, photoOf(c)); }
  });

  /* 사진 넣기 */
  document.getElementById('ppick').addEventListener('click',function(){ if(sel){ picker.value=''; picker.click(); } });
  document.getElementById('pdel').addEventListener('click',function(){
    if(!sel) return;
    var s=sel, wasCloud=!!cloudPhoto(s.code);
    try{ localStorage.removeItem(KEY+s.code); }catch(e){}
    delete cloud[CK(s.code)];
    if(s.code==='bali') drawBali(); else paint(s.code);
    updateProg(); select(s.code, s.name);
    note.textContent=s.name+' 사진을 지웠어';
    if(wasCloud){
      CloudPhotos.remove(s.code).catch(function(){
        note.textContent='이 기기에서는 지웠는데 클라우드에서는 못 지웠어. 잠시 후 다시 해줘 🥲';
        syncCloud();
      });
    }
  });

  function toBlob(cv, cb){
    if(cv.toBlob){ cv.toBlob(cb,'image/jpeg',0.72); return; }
    try{
      var d=cv.toDataURL('image/jpeg',0.72), bin=atob(d.split(',')[1]);
      var u=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
      cb(new Blob([u],{type:'image/jpeg'}));
    }catch(e){ cb(null); }
  }

  function celebrate(s,msg){
    if(s.code==='bali') drawBali(); else paint(s.code);
    updateProg(); select(s.code,s.name);
    note.textContent=msg;
    var r=mapEl.getBoundingClientRect();
    FX.burst(r.left+r.width/2, r.top+r.height/2, 60);
    for(var k=0;k<5;k++) setTimeout(FX.heart,k*130);
  }

  /* 클라우드가 안 될 때(설정 전·오프라인) 쓰는 이 기기 저장 */
  function saveLocal(s,dataUrl,msg){
    try{
      localStorage.setItem(KEY+s.code, dataUrl);
      celebrate(s, msg || (s.name+' 도장 깼다! 📸'));
    }catch(e){ note.textContent='저장 공간이 부족해. 사진 하나 지우고 다시 해줘 🙏'; }
  }

  picker.addEventListener('change',function(){
    var f=picker.files&&picker.files[0]; if(!f||!sel) return;
    var s=sel, rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var max=760,w=im.width,h=im.height;
        if(w>h&&w>max){ h=Math.round(h*max/w); w=max; }
        else if(h>=w&&h>max){ w=Math.round(w*max/h); h=max; }
        var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(im,0,0,w,h);
        var dataUrl=cv.toDataURL('image/jpeg',0.72);

        if(!CLOUD){ saveLocal(s,dataUrl); return; }

        note.textContent=s.name+' 사진 올리는 중… ☁️';
        toBlob(cv,function(blob){
          if(!blob){ saveLocal(s,dataUrl); return; }
          CloudPhotos.upload(s.code, blob).then(function(url){
            cloud[CK(s.code)]=url;
            try{ localStorage.removeItem(KEY+s.code); }catch(e){}   // 클라우드에 있으니 기기 저장은 비움
            celebrate(s, s.name+' 도장 깼다! 📸 자기야 폰에서도 보여 💗');
          }).catch(function(){
            saveLocal(s,dataUrl, s.name+' 도장 깼다! 📸 (인터넷이 안 돼서 이 기기에만 저장했어)');
          });
        });
      };
      im.onerror=function(){ note.textContent='이 사진은 못 읽었어 🥲'; };
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  });

  /* 보기 버튼 */
  function fitKr(){ map.fitBounds([[33.1,125.9],[38.6,129.6]],{padding:[20,20]}); }
  document.getElementById('fitKr').addEventListener('click', fitKr);
  document.getElementById('metro').addEventListener('click', function(){ map.setView([37.55,126.99],10); });
  document.getElementById('goBali').addEventListener('click', function(){
    map.setView([-8.65,115.2167],7);
    if(layers['C-IDN']) select('C-IDN','인도네시아 (발리)');
    else select('bali','발리');
  });
  document.getElementById('world').addEventListener('click', function(){ map.setView([20,60],2); });
  document.getElementById('toggle').addEventListener('click', function(){
    showBorders=!showBorders;
    this.textContent=showBorders?'지역 경계 끄기':'지역 경계 켜기';
    for(var c in layers) paint(c);
  });

  if(CLOUD){
    note.textContent='사진을 넣으면 자동으로 올라가서 자기야 폰에서도 바로 보여요 ☁️';
    syncCloud();
  }

  fitKr();
  var card=document.querySelector('.card');
  if(card) card.addEventListener('animationend', function(){ map.invalidateSize(); fitKr(); });
  setTimeout(function(){ map.invalidateSize(); fitKr(); }, 400);
  window.addEventListener('resize', function(){ map.invalidateSize(); });
})();
</script>
