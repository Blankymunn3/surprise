<title>긁는 복권 🪙</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap" rel="stylesheet" />
<style>
  :root{--rose:#ff4d78;--rose-deep:#e11d5b;--pink-1:#ffe3ee;--pink-2:#ffc2d6;--pink-3:#ffd9c9;--ink:#5a2740;--ink-soft:#96566f;--card:rgba(255,255,255,.62);--font:"Jua","Apple SD Gothic Neo","Pretendard",system-ui,sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font-family:var(--font);color:var(--ink);min-height:100svh;overflow-x:hidden;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;background-attachment:fixed;
    background:radial-gradient(120% 90% at 15% 0%,var(--pink-1),transparent 55%),radial-gradient(120% 100% at 100% 100%,var(--pink-3),transparent 55%),linear-gradient(160deg,#fff0f5 0%,var(--pink-2) 60%,#ffb3c9 100%)}
  .stage{position:relative;z-index:2;min-height:100svh;display:grid;place-items:center;padding:24px}
  .card{position:relative;width:min(92vw,480px);background:var(--card);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.75);border-radius:34px;box-shadow:0 30px 70px -30px rgba(190,30,80,.5),inset 0 1px 0 rgba(255,255,255,.9);padding:38px 26px;text-align:center;animation:pop .6s cubic-bezier(.16,1.2,.3,1) both}
  @keyframes pop{from{transform:scale(.7) translateY(20px);opacity:0}to{transform:none;opacity:1}}
  .emoji{font-size:56px;line-height:1;display:block;animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
  h1{font-size:clamp(26px,6.4vw,38px);margin:12px 0 6px;color:var(--rose-deep);text-shadow:0 2px 0 rgba(255,255,255,.6)}
  .sub{font-family:"Gaegu","Apple SD Gothic Neo",sans-serif;font-size:clamp(15px,4.2vw,19px);color:var(--ink-soft);margin:0 0 22px}
  .scratch{position:relative;margin:4px auto 18px;width:min(84vw,360px);height:190px;border-radius:20px;overflow:hidden;box-shadow:0 16px 40px -18px rgba(225,29,91,.45);touch-action:none}
  .prize{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,#fff,#fff2f6)}
  .prize .pico{font-size:58px;line-height:1}
  .prize .ptxt{font-size:clamp(20px,5.4vw,26px);color:var(--rose-deep)}
  .foil{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
  .foil:active{cursor:grabbing}
  .btn{font-family:var(--font);border:none;cursor:pointer;border-radius:999px;padding:14px 26px;font-size:clamp(17px,4.4vw,20px);color:#fff;background:linear-gradient(135deg,var(--rose),var(--rose-deep));box-shadow:0 14px 30px -10px rgba(225,29,91,.7),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .12s}
  .btn:active{transform:scale(.96)}.btn:hover{transform:scale(1.04)}
  .hint{margin-top:8px;height:18px;font-family:"Gaegu",sans-serif;font-size:14px;color:var(--ink-soft);opacity:.85}
  #confetti{position:fixed;inset:0;z-index:45;pointer-events:none}
  #hearts{position:fixed;inset:0;z-index:44;pointer-events:none;overflow:hidden}
  .heart-b{position:fixed;bottom:-8%;animation:floatUp var(--dur) linear forwards}
  @keyframes floatUp{0%{transform:translateY(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(-118vh) translateX(var(--sway)) rotate(var(--rot));opacity:0}}
</style>

<div class="stage">
  <main class="card">
    <span class="emoji">🪙</span>
    <h1>긁어서 확인해!</h1>
    <p class="sub">손가락(마우스)으로 은박을 벅벅 긁어봐</p>
    <div class="scratch" id="box">
      <div class="prize"><div class="pico" id="pico">🎁</div><div class="ptxt" id="ptxt"></div></div>
      <canvas class="foil" id="foil"></canvas>
    </div>
    <button class="btn" id="again" type="button">다시 긁기 🔄</button>
    <div class="hint" id="hint">🪙 벅벅 긁어보세요</div>
  </main>
</div>

<div id="hearts" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
window.FX=(function(){
  var c=document.getElementById('confetti'),x=c.getContext('2d'),DPR=Math.min(window.devicePixelRatio||1,2),P=[],raf=null;
  var COL=["#ff4d78","#e11d5b","#ff8fab","#ffd166","#ff5da2","#ffffff","#ff9770"];
  function sz(){c.width=innerWidth*DPR;c.height=innerHeight*DPR;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(DPR,0,0,DPR,0,0)}sz();addEventListener('resize',sz);
  function burst(px,py,n){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=4+Math.random()*11;P.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,g:.16+Math.random()*.12,s:7+Math.random()*10,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,c:COL[(Math.random()*COL.length)|0],h:Math.random()<.4,l:0,m:120+Math.random()*60})}if(!raf)raf=requestAnimationFrame(tick)}
  function tick(){x.clearRect(0,0,innerWidth,innerHeight);for(var i=P.length-1;i>=0;i--){var p=P[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.995;p.r+=p.vr;p.l++;var a=Math.max(0,1-p.l/p.m);x.save();x.globalAlpha=a;x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;if(p.h){x.font=p.s*1.7+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('♥',0,0)}else x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();if(p.l>=p.m||p.y>innerHeight+40)P.splice(i,1)}if(P.length)raf=requestAnimationFrame(tick);else{raf=null;x.clearRect(0,0,innerWidth,innerHeight)}}
  var HL=document.getElementById('hearts'),EM=["❤️","💕","💖","💘","💗","🩷","😍","🥰","💞","💓"],ht=null;
  function heart(){var s=document.createElement('div');s.className='heart-b';s.textContent=EM[(Math.random()*EM.length)|0];s.style.left=(Math.random()*100)+'%';s.style.fontSize=(26+Math.random()*40)+'px';s.style.setProperty('--dur',(4.5+Math.random()*4)+'s');s.style.setProperty('--sway',(Math.random()*180-90)+'px');s.style.setProperty('--rot',(Math.random()*120-60)+'deg');HL.appendChild(s);s.addEventListener('animationend',function(){s.remove()})}
  function party(){burst(innerWidth/2,innerHeight*.4,150);setTimeout(function(){burst(innerWidth*.25,innerHeight*.5,70)},220);for(var i=0;i<16;i++)setTimeout(heart,i*100);if(ht)clearInterval(ht);ht=setInterval(function(){heart()},340);setTimeout(function(){clearInterval(ht);ht=null},5500)}
  return{burst:burst,heart:heart,party:party}
})();

(function(){
  var prizes=[["❤️","사랑해!"],["🎉","당첨! 데이트"],["💋","뽀뽀 쿠폰"],["🤗","백허그권"],["🍗","야식 쏜다"],["🎁","깜짝 선물"],["☕","카페 데이트"],["🧞","소원 하나 OK"],["💐","꽃 한 송이"],["🍰","디저트 타임"]];
  var box=document.getElementById('box'),foil=document.getElementById('foil'),ctx=foil.getContext('2d');
  var pico=document.getElementById('pico'),ptxt=document.getElementById('ptxt'),hint=document.getElementById('hint');
  var DPR=Math.min(window.devicePixelRatio||1,2), W=0,H=0, drawing=false, revealed=false, moves=0, last=-1;

  function setPrize(){ var i; do{i=(Math.random()*prizes.length)|0;}while(i===last&&prizes.length>1); last=i; pico.textContent=prizes[i][0]; ptxt.textContent=prizes[i][1]; }

  function paintFoil(){
    // clientWidth/Height는 transform(카드 등장 scale)에 영향받지 않는 '레이아웃' 크기 → 어긋남 방지
    W=box.clientWidth; H=box.clientHeight;
    if(!W||!H){ requestAnimationFrame(paintFoil); return; }  // 레이아웃 확정 전이면 다음 프레임에
    foil.width=Math.round(W*DPR); foil.height=Math.round(H*DPR);
    foil.style.width=W+'px'; foil.style.height=H+'px';       // 표시 크기를 카드에 정확히 고정
    ctx.setTransform(DPR,0,0,DPR,0,0);
    var g=ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,'#e9c7d6'); g.addColorStop(.5,'#f6d9e4'); g.addColorStop(1,'#dcb6c9');
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // sparkles
    ctx.fillStyle='rgba(255,255,255,.5)';
    for(var k=0;k<40;k++){ctx.beginPath();ctx.arc(Math.random()*W,Math.random()*H,Math.random()*1.6+.4,0,6.28);ctx.fill();}
    ctx.fillStyle='rgba(225,29,91,.55)'; ctx.font='bold 22px "Jua",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🪙 긁어보세요', W/2, H/2);
    ctx.globalCompositeOperation='destination-out';
  }

  function pos(e){
    var r=foil.getBoundingClientRect(); var t=(e.touches&&e.touches[0])||e;
    var sx=W/(r.width||W), sy=H/(r.height||H);   // 확대/축소 중에도 좌표가 정확하도록
    return {x:(t.clientX-r.left)*sx, y:(t.clientY-r.top)*sy};
  }
  function erase(p){ ctx.beginPath(); ctx.arc(p.x,p.y,24,0,6.28); ctx.fill(); }

  function ratio(){
    var img=ctx.getImageData(0,0,foil.width,foil.height).data, clear=0, step=16*4; // 샘플링
    for(var i=3;i<img.length;i+=step){ if(img[i]===0) clear++; }
    return clear/(img.length/step);
  }
  function reveal(){
    revealed=true; ctx.clearRect(0,0,W,H); hint.textContent='🎉 당첨을 확인했어요!'; FX.party();
    var r=box.getBoundingClientRect(); FX.burst(r.left+r.width/2, r.top+r.height/2, 60);
  }

  function down(e){ if(revealed)return; drawing=true; erase(pos(e)); if(e.cancelable)e.preventDefault(); }
  function move(e){ if(!drawing||revealed)return; erase(pos(e)); if(++moves%6===0 && ratio()>0.5) reveal(); if(e.cancelable)e.preventDefault(); }
  function up(){ drawing=false; if(!revealed && ratio()>0.45) reveal(); }

  foil.addEventListener('pointerdown',down); foil.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up);
  // 터치 폴백
  foil.addEventListener('touchstart',down,{passive:false}); foil.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',up);

  function reset(){ revealed=false; moves=0; setPrize(); paintFoil(); hint.textContent='🪙 벅벅 긁어보세요'; }
  document.getElementById('again').addEventListener('click', reset);
  window.addEventListener('resize', function(){ if(!revealed) paintFoil(); });
  // 폰트 로드 후 텍스트 선명하게 재그리기
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ if(!revealed) paintFoil(); });
  // 카드 등장 애니메이션(scale)이 끝난 '최종 크기'로 다시 그리기 — 캔버스 어긋남 방지
  var cardEl=document.querySelector('.card');
  if(cardEl) cardEl.addEventListener('animationend', function(){ if(!revealed) paintFoil(); });
  setTimeout(function(){ if(!revealed) paintFoil(); }, 800);
  setPrize(); paintFoil();
})();
</script>
