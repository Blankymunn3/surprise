  .wheelwrap{position:relative;width:100%;max-width:330px;aspect-ratio:1/1;margin:6px auto 18px}

  .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;
    background:rgba(255,255,255,.92);border:2px solid #ffc2d6;display:grid;place-items:center;font-size:24px;
    box-shadow:0 6px 16px -6px rgba(190,30,80,.5);z-index:2}
  .win{min-height:40px;margin:2px 0 16px;font-size:clamp(22px,6vw,30px);color:var(--rose-deep)}
  .win .sm{font-family:var(--font-hand);font-size:15px;color:var(--ink-soft);display:block}

<div class="stage">
  <main class="card">
    <span class="emoji">🍽️</span>
    <h1>오늘 저녁 뭐 먹지?</h1>
    <p class="sub">돌려서 나온 걸로 먹기! 불만 없기 😤</p>

    <div class="wheelwrap">
      <div class="pin">🔻</div>
      <canvas id="wheel" width="660" height="660"></canvas>
      <div class="hub">🍴</div>
    </div>

    <div class="win" id="win"></div>
    <button class="btn" id="spin" type="button">돌리기 🎡</button>
    <div class="note" id="note"></div>
  </main>
</div>

<script src="../assets/fx.js?v=3"></script>
<script>
(function(){
  var items=["순두부","짬뽕","삼겹살","치킨","초밥","국밥","파스타","마라탕","냉면","피자","족발","떡볶이"];
  var colors=["#ff8fab","#ffd6e2","#ff9fbb","#ffe0ea","#ffa9c2","#ffd0dd","#ff97b5","#ffe6ee","#ffb3c9","#ffdbe6","#ff9ec0","#ffe9f0"];
  var cv=document.getElementById('wheel'), ctx=cv.getContext('2d');
  var winEl=document.getElementById('win'), btn=document.getElementById('spin'), note=document.getElementById('note');
  var N=items.length, SEG=2*Math.PI/N, rot=-Math.PI/2, spinning=false, count=0;
  var DPR=Math.min(window.devicePixelRatio||1,2);

  function fit(){
    var css=cv.clientWidth||330;
    cv.width=Math.round(css*DPR); cv.height=Math.round(css*DPR);
    draw();
  }
  function draw(){
    var W=cv.width, R=W/2;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,W,W);
    ctx.save(); ctx.translate(R,R); ctx.rotate(rot);
    for(var i=0;i<N;i++){
      var a0=i*SEG, a1=a0+SEG;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R-4*DPR,a0,a1); ctx.closePath();
      ctx.fillStyle=colors[i%colors.length]; ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=2*DPR; ctx.stroke();
      // 글자
      ctx.save(); ctx.rotate(a0+SEG/2);
      ctx.fillStyle='#a4235a'; ctx.textAlign='right'; ctx.textBaseline='middle';
      ctx.font='600 '+(17*DPR)+'px "Jua","Apple SD Gothic Neo",sans-serif';
      ctx.fillText(items[i], R-22*DPR, 0);
      ctx.restore();
    }
    ctx.restore();
    // 테두리
    ctx.beginPath(); ctx.arc(R,R,R-3*DPR,0,6.2832);
    ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.lineWidth=6*DPR; ctx.stroke();
  }

  function spin(){
    if(spinning) return;
    spinning=true; btn.classList.add('off'); winEl.textContent=''; note.textContent='두구두구…';
    var idx=(Math.random()*N)|0;
    // 당첨 조각의 중앙이 위쪽(-90°)에 오도록 회전값 계산 + 여러 바퀴
    var base=-Math.PI/2-(idx*SEG+SEG/2);
    var turns=4+((Math.random()*3)|0);
    var from=rot, to=base+2*Math.PI*turns;
    while(to<from) to+=2*Math.PI;
    var dur=3800, t0=null;
    function ease(t){ return 1-Math.pow(1-t,4); }
    function frame(ts){
      if(!t0)t0=ts;
      var t=Math.min(1,(ts-t0)/dur);
      rot=from+(to-from)*ease(t);
      draw();
      if(t<1){ requestAnimationFrame(frame); return; }
      spinning=false; btn.classList.remove('off'); btn.textContent='다시 돌리기 🎡';
      winEl.innerHTML='오늘은 <b>'+items[idx]+'</b>! <span class="sm">맛있게 먹자 😋</span>';
      count++; note.textContent='돌린 횟수: '+count+'번';
      var r=cv.getBoundingClientRect();
      FX.burst(r.left+r.width/2, r.top+r.height/2, 90);
      for(var k=0;k<8;k++) setTimeout(FX.heart, k*110);
    }
    requestAnimationFrame(frame);
  }

  btn.addEventListener('click', spin);
  window.addEventListener('resize', fit);
  var card=document.querySelector('.card');
  if(card) card.addEventListener('animationend', fit);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
  fit();
})();
</script>
