name: ios

# PR 이 열려 있으면 push 와 pull_request 가 둘 다 돌아 같은 빌드를 두 번 합니다.
# 브랜치는 pull_request 로만 보고, push 는 main 에서만 봅니다.
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: 스위프트 버전 확인
        run: swift --version

      - name: 패키지 빌드
        working-directory: ios/Packages/Jjaguk
        run: swift build

      - name: 패키지 테스트
        working-directory: ios/Packages/Jjaguk
        run: swift test

      # 이 저장소의 작업 컨테이너에는 Xcode 가 없어서 앱 껍데기는 **여기서만** 확인됩니다.
      # 프로젝트 파일이 열리는지, 시뮬레이터용으로 실제로 빌드되는지 봅니다.
      - name: 앱 빌드 (시뮬레이터)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Jjaguk.xcodeproj \
            -scheme Jjaguk \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            > /tmp/xcodebuild.log 2>&1 || {
              # 로그가 길어서 오류 줄만 맨 끝에 다시 찍습니다 — 실패를 바로 읽으려고.
              tail -80 /tmp/xcodebuild.log
              echo '── 오류 줄만 ──'
              grep -E 'error:' /tmp/xcodebuild.log | head -40
              exit 1
            }
          echo '앱 빌드 성공'
