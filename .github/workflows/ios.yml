name: ios

# PR 이 열려 있으면 push 와 pull_request 가 둘 다 돌아 같은 빌드를 두 번 합니다.
# 브랜치는 pull_request 로만 보고, push 는 main 에서만 봅니다.
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/Packages/MemoryMap

    steps:
      - uses: actions/checkout@v4

      - name: 스위프트 버전 확인
        run: swift --version

      - name: 빌드
        run: swift build

      - name: 테스트
        run: swift test
