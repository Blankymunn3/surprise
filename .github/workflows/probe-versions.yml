# 이 컨테이너에서는 dl.google.com 이 막혀 있어 안드로이드 의존성 버전을 확인할 수 없습니다.
# 러너에서 한 번 찍어 보고 버전을 고정한 뒤 이 워크플로는 지웁니다.
name: probe-versions

on:
  workflow_dispatch:
  push:
    branches: [claude/workspace-check-xfcars]
    paths: ['.github/workflows/probe-versions.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: AGP 8.x 마지막 버전
        run: |
          curl -sS "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml" \
            | grep -oP '(?<=<version>)8\.[^<]+' | grep -vE 'alpha|beta|rc' | tail -8 | tr '\n' ' '; echo
      - name: Compose BOM 이 물고 오는 것 확인
        run: |
          curl -sS "https://dl.google.com/dl/android/maven2/androidx/compose/compose-bom/2026.06.01/compose-bom-2026.06.01.pom" | head -60
      - name: 코틀린 그래들 플러그인
        run: |
          curl -sS "https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml" \
            | grep -oP '(?<=<version>)2\.[0-9.]+(?=</version>)' | grep -vE 'Beta|RC|M[0-9]' | tail -6 | tr '\n' ' '; echo
          curl -sS "https://repo1.maven.org/maven2/org/jetbrains/kotlin/compose-compiler-gradle-plugin/maven-metadata.xml" \
            | grep -oP '(?<=<version>)2\.[0-9.]+(?=</version>)' | tail -4 | tr '\n' ' '; echo
      - name: AGP 최신 8.x 가 요구하는 Gradle
        run: |
          A=$(curl -sS "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml" | grep -oP '(?<=<version>)8\.[^<]+' | grep -vE 'alpha|beta|rc' | tail -1)
          echo "AGP=$A"
          curl -sS "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/$A/gradle-$A.pom" | head -40
