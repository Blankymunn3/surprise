name: android

# PR 이 열려 있으면 push 와 pull_request 가 둘 다 돌아 같은 빌드를 두 번 합니다.
# 브랜치는 pull_request 로만 보고, push 는 main 에서만 봅니다.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 러너가 4코어라 그래들 병렬 + 코틀린 데몬 여럿이 붙으면 스왑에 들어가
    # 몇십 분씩 매달립니다. 걸리면 매달리지 말고 실패하도록 시간을 자릅니다.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 실패했을 때 로그 끝에서 바로 원인을 보려고 컴파일 오류만 따로 모읍니다.
      # 그래들 스택트레이스가 수백 줄이라 그냥 두면 원인이 파묻힙니다.
      - name: 단위 테스트
        run: |
          set -o pipefail
          ./gradlew test --console=plain --no-parallel --no-configuration-cache \
            -Dkotlin.daemon.jvmargs=-Xmx2g 2>&1 | tee /tmp/gradle-test.log

      - name: 디버그 빌드
        run: |
          set -o pipefail
          ./gradlew assembleDebug --console=plain --no-parallel --no-configuration-cache \
            -Dkotlin.daemon.jvmargs=-Xmx2g 2>&1 | tee /tmp/gradle-build.log

      - name: 컴파일 오류만 모아 보기
        if: failure()
        run: |
          grep -hE "^e: |^\s+e: " /tmp/gradle-*.log | head -60 || echo "컴파일 오류 줄은 없습니다 (다른 원인)"

      - name: 테스트 결과 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: android/**/build/reports/tests/
          if-no-files-found: ignore
