name: android

# PR 이 열려 있으면 push 와 pull_request 가 둘 다 돌아 같은 빌드를 두 번 합니다.
# 브랜치는 pull_request 로만 보고, push 는 main 에서만 봅니다.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 모듈 13개(그중 5개가 Compose)를 콜드로 컴파일하면 4코어 러너에서 오래 걸립니다.
    # --no-parallel 은 오히려 더 느려서 되돌렸고, 설정 캐시만 끕니다.
    # 그래도 매달리면 하염없이 두지 말고 자릅니다.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 실패했을 때 로그 끝에서 바로 원인을 보려고 컴파일 오류만 따로 모읍니다.
      # 그래들 스택트레이스가 수백 줄이라 그냥 두면 원인이 파묻힙니다.
      - name: 단위 테스트
        run: |
          set -o pipefail
          ./gradlew test --console=plain --no-configuration-cache \
            -Dkotlin.daemon.jvmargs=-Xmx2g 2>&1 | tee /tmp/gradle-test.log

      - name: 디버그 빌드
        run: |
          set -o pipefail
          ./gradlew assembleDebug --console=plain --no-configuration-cache \
            -Dkotlin.daemon.jvmargs=-Xmx2g 2>&1 | tee /tmp/gradle-build.log

      - name: 컴파일 오류만 모아 보기
        if: failure()
        run: |
          grep -hE "^e: |^\s+e: " /tmp/gradle-*.log | head -60 || echo "컴파일 오류 줄은 없습니다 (다른 원인)"

      - name: 테스트 결과 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: android/**/build/reports/tests/
          if-no-files-found: ignore
