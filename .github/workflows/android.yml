name: 안드로이드 앱 빌드

# 지도나 앱 설정이 바뀌면 APK 를 새로 만들어 둡니다.
# 만들어진 APK 는 Actions 실행 화면 맨 아래 Artifacts 에서 받을 수 있고,
# v1.0.0 같은 태그를 붙여 올리면 Releases 에도 올라갑니다.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'map/**'
      - 'assets/**'
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:          # 필요할 때 손으로 실행

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 서명 키를 Secrets 에 넣었는지 여부 (secrets 는 if 에서 직접 못 써서 여기로 옮김)
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 안드로이드 SDK 준비
        uses: android-actions/setup-android@v3

      - name: 의존성 설치
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: 지도 화면을 앱에 넣기
        working-directory: app
        run: npm run build:www

      - name: Capacitor 동기화
        working-directory: app
        run: npx cap sync android

      - name: APK 빌드 (직접 설치용)
        working-directory: app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK 이름 정리
        run: |
          mkdir -p out
          cp app/android/app/build/outputs/apk/debug/app-debug.apk \
             "out/memory-map-$(date +%Y%m%d)-${GITHUB_SHA::7}.apk"
          ls -la out

      - name: APK 올리기 (Actions 화면에서 받기)
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          retention-days: 90

      # 스토어에 올릴 AAB 는 서명 키가 있을 때만 만듭니다.
      # 저장소 Settings → Secrets and variables → Actions 에 아래 4개를 넣으면 자동으로 켜집니다.
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: 서명 키 준비
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/android/release.keystore

      - name: AAB 빌드 (스토어 업로드용)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: app/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: AAB 올리기
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aab
          path: app/android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: 태그를 붙였으면 Releases 에도 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
