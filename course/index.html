<style>
  .card{width:min(94vw,560px)}
  .timeline{list-style:none;margin:4px 0 20px;padding:0;position:relative;text-align:left}
  .timeline:empty{margin:0}
  .timeline:before{content:"";position:absolute;left:31px;top:18px;bottom:18px;width:3px;border-radius:2px;
    background:linear-gradient(180deg,rgba(255,77,120,.5),rgba(255,77,120,.12))}
  .timeline:empty:before{display:none}
  .slot{position:relative;display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;
    padding:8px 0;opacity:0;animation:rise .45s cubic-bezier(.16,1.1,.3,1) forwards}
  @keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
  .dot{width:46px;height:46px;margin-left:8px;border-radius:50%;display:grid;place-items:center;
    font-size:22px;background:rgba(255,255,255,.94);border:2px solid #ffc2d6;
    box-shadow:0 8px 18px -8px rgba(190,30,80,.5);position:relative;z-index:1}
  .slotbody{background:rgba(255,255,255,.74);border:1px solid rgba(255,255,255,.9);border-radius:20px;
    padding:12px 14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 10px 22px -16px rgba(190,30,80,.6)}
  .when{display:block;font-family:var(--font-hand);font-size:14px;color:var(--rose-deep)}
  .where{font-size:clamp(17px,4.6vw,20px);color:var(--ink);margin:2px 0 9px;line-height:1.3;word-break:keep-all}
  .map{display:inline-block;text-decoration:none;font-family:var(--font);font-size:14px;color:var(--rose-deep);
    background:rgba(255,255,255,.95);border-radius:999px;padding:8px 14px;
    box-shadow:0 8px 18px -10px rgba(225,29,91,.6);transition:transform .12s}
  .map:hover{transform:scale(1.04);background:#fff}
  .map:active{transform:scale(.96)}
  .btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
</style>

<a class="home" href="../">← 목록</a>

<div class="stage">
  <main class="card">
    <span class="emoji">🎲</span>
    <h1>오늘의 강릉 코스</h1>
    <p class="sub">뽑힌 대로 가는 거다. 취소 없기 🙅</p>

    <ol class="timeline" id="timeline"></ol>

    <div class="btnrow">
      <button class="btn" id="roll" type="button">코스 뽑기 🎲</button>
    </div>
    <div class="note" id="note"></div>
  </main>
</div>

<script src="../assets/fx.js"></script>
<script>
(function(){

  /* 장소 목록 (실제 강릉 장소만). name = 화면 표시, q = 카카오맵 검색어 */
  var MORNING = [
    { name: "경포해변" },
    { name: "강문해변" },
    { name: "사천해변" },
    { name: "안목해변 커피거리" },
    { name: "정동진 해변" },
    { name: "주문진 영진해변(도깨비 촬영지)", q: "주문진 영진해변" },
    { name: "소돌 아들바위공원" },
    { name: "경포호" },
    { name: "정동심곡 바다부채길" }
  ];
  var LUNCH = [
    { name: "동화가든(초당순두부)", q: "동화가든 초당순두부" },
    { name: "초당할머니순두부" },
    { name: "교동반점" },
    { name: "엄지네포장마차" },
    { name: "강릉중앙시장" },
    { name: "주문진 수산시장" }
  ];
  var AFTERNOON = [
    { name: "테라로사" },
    { name: "보헤미안 박이추커피" },
    { name: "순두부젤라또" },
    { name: "하슬라아트월드" },
    { name: "선교장" },
    { name: "오죽헌" },
    { name: "참소리축음기·에디슨과학박물관", q: "참소리축음기 에디슨과학박물관" },
    { name: "경포아쿠아리움" },
    { name: "정동진 레일바이크" },
    { name: "정동진역" },
    { name: "정동진 모래시계공원" },
    { name: "경포대" }
  ];
  var EVENING = [
    { name: "엄지네포장마차" },
    { name: "교동반점" },
    { name: "강릉중앙시장" },
    { name: "주문진 수산시장" },
    { name: "동화가든(초당순두부)", q: "동화가든 초당순두부" },
    { name: "안목해변 커피거리" },
    { name: "경포해변" },
    { name: "정동진 모래시계공원" }
  ];

  var SLOTS = [
    { icon: "🌅", when: "아침 · 바다 산책", pool: MORNING },
    { icon: "🍚", when: "점심 · 든든하게", pool: LUNCH },
    { icon: "☕", when: "오후 · 구경 & 카페", pool: AFTERNOON },
    { icon: "🌆", when: "저녁 · 마무리", pool: EVENING }
  ];

  var timeline = document.getElementById('timeline');
  var rollBtn = document.getElementById('roll');
  var note = document.getElementById('note');
  var rolls = 0;

  function query(p){ return p.q ? p.q : p.name; }

  // 같은 장소가 두 번 나오지 않게 뽑기
  function draw(){
    var used = {}, out = [], i, j, pool, cands, p;
    for(i = 0; i < SLOTS.length; i++){
      pool = SLOTS[i].pool;
      cands = [];
      for(j = 0; j < pool.length; j++){
        if(!used[pool[j].name]) cands.push(pool[j]);
      }
      if(!cands.length) cands = pool;   // 후보가 다 떨어지면 그냥 전체에서
      p = cands[(Math.random() * cands.length) | 0];
      used[p.name] = true;
      out.push({ icon: SLOTS[i].icon, when: SLOTS[i].when, place: p });
    }
    return out;
  }

  function render(course){
    var i;
    timeline.innerHTML = '';
    for(i = 0; i < course.length; i++){
      var it = course[i];

      var li = document.createElement('li');
      li.className = 'slot';
      li.style.animationDelay = (i * 170) + 'ms';

      var dot = document.createElement('div');
      dot.className = 'dot';
      dot.setAttribute('aria-hidden', 'true');
      dot.textContent = it.icon;

      var body = document.createElement('div');
      body.className = 'slotbody';

      var when = document.createElement('span');
      when.className = 'when';
      when.textContent = it.when;

      var where = document.createElement('div');
      where.className = 'where';
      where.textContent = it.place.name;

      var a = document.createElement('a');
      a.className = 'map';
      a.href = 'https://map.kakao.com/?q=' + encodeURIComponent(query(it.place));
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = '카카오맵에서 보기 🗺️';

      body.appendChild(when);
      body.appendChild(where);
      body.appendChild(a);
      li.appendChild(dot);
      li.appendChild(body);
      timeline.appendChild(li);

      // 칸이 하나씩 뜰 때 소소한 폭죽
      (function(el, delay){
        setTimeout(function(){
          var r = el.getBoundingClientRect();
          FX.burst(r.left + r.width / 2, r.top + r.height / 2, 14);
        }, delay + 120);
      })(dot, i * 170);
    }
  }

  function roll(){
    render(draw());
    rolls++;
    rollBtn.textContent = '다시 뽑기 🎲';
    note.textContent = '지도 버튼 누르면 카카오맵으로 열려 🗺️ (뽑은 횟수: ' + rolls + '번)';
    setTimeout(FX.heart, 300);
    setTimeout(FX.heart, 620);
  }

  rollBtn.addEventListener('click', roll);
})();
</script>
