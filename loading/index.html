<title>사랑 측정 중… 💗</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap" rel="stylesheet" />
<style>
  :root{--rose:#ff4d78;--rose-deep:#e11d5b;--pink-1:#ffe3ee;--pink-2:#ffc2d6;--pink-3:#ffd9c9;--ink:#5a2740;--ink-soft:#96566f;--card:rgba(255,255,255,.62);--font:"Jua","Apple SD Gothic Neo","Pretendard",system-ui,sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font-family:var(--font);color:var(--ink);min-height:100svh;overflow-x:hidden;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;background-attachment:fixed;
    background:radial-gradient(120% 90% at 15% 0%,var(--pink-1),transparent 55%),radial-gradient(120% 100% at 100% 100%,var(--pink-3),transparent 55%),linear-gradient(160deg,#fff0f5 0%,var(--pink-2) 60%,#ffb3c9 100%)}
  .stage{position:relative;z-index:2;min-height:100svh;display:grid;place-items:center;padding:24px}
  .card{position:relative;width:min(92vw,480px);background:var(--card);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.75);border-radius:34px;box-shadow:0 30px 70px -30px rgba(190,30,80,.5),inset 0 1px 0 rgba(255,255,255,.9);padding:44px 30px;text-align:center;animation:pop .6s cubic-bezier(.16,1.2,.3,1) both}
  @keyframes pop{from{transform:scale(.7) translateY(20px);opacity:0}to{transform:none;opacity:1}}
  .emoji{font-size:60px;line-height:1;display:block;animation:beat 1s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}25%{transform:scale(1.18)}40%{transform:scale(1)}55%{transform:scale(1.12)}}
  h1{font-size:clamp(26px,6.4vw,38px);margin:14px 0 4px;color:var(--rose-deep);text-shadow:0 2px 0 rgba(255,255,255,.6)}
  .status{font-family:"Gaegu","Apple SD Gothic Neo",sans-serif;font-size:clamp(16px,4.4vw,20px);color:var(--ink-soft);margin:8px 0 22px;min-height:26px}
  .track{height:20px;border-radius:999px;background:rgba(225,29,91,.12);overflow:hidden;box-shadow:inset 0 1px 3px rgba(190,30,80,.2)}
  .bar{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#ff8fab,var(--rose),var(--rose-deep));transition:width .12s linear;box-shadow:0 0 12px rgba(255,93,162,.6)}
  .pct{margin-top:10px;font-size:26px;color:var(--rose-deep);font-variant-numeric:tabular-nums}
  /* result */
  #res{display:none}
  #res.show{display:block;animation:pop .6s cubic-bezier(.16,1.3,.3,1) both}
  #res .big{font-size:clamp(52px,15vw,104px);color:var(--rose-deep);line-height:1;text-shadow:0 3px 0 rgba(255,255,255,.7)}
  #res .rmsg{font-family:"Gaegu",sans-serif;font-size:clamp(18px,5vw,24px);color:var(--ink);margin-top:12px}
  .again{margin-top:26px;font-family:var(--font);cursor:pointer;border:none;background:rgba(255,255,255,.9);color:var(--rose-deep);font-size:16px;padding:12px 24px;border-radius:999px;box-shadow:0 10px 24px -10px rgba(225,29,91,.6)}
  #confetti{position:fixed;inset:0;z-index:45;pointer-events:none}
  #hearts{position:fixed;inset:0;z-index:44;pointer-events:none;overflow:hidden}
  .heart-b{position:fixed;bottom:-8%;animation:floatUp var(--dur) linear forwards}
  @keyframes floatUp{0%{transform:translateY(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(-118vh) translateX(var(--sway)) rotate(var(--rot));opacity:0}}
</style>

<div class="stage">
  <main class="card">
    <div id="load">
      <span class="emoji">💗</span>
      <h1>사랑 측정 중…</h1>
      <div class="status" id="status">시스템 준비 중…</div>
      <div class="track"><div class="bar" id="bar"></div></div>
      <div class="pct" id="pct">0%</div>
    </div>
    <div id="res">
      <div class="big" id="resPct">99.9%</div>
      <div class="rmsg" id="rmsg"></div>
      <button class="again" id="again" type="button">다시 측정 🔄</button>
    </div>
  </main>
</div>

<div id="hearts" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
window.FX=(function(){
  var c=document.getElementById('confetti'),x=c.getContext('2d'),DPR=Math.min(window.devicePixelRatio||1,2),P=[],raf=null;
  var COL=["#ff4d78","#e11d5b","#ff8fab","#ffd166","#ff5da2","#ffffff","#ff9770"];
  function sz(){c.width=innerWidth*DPR;c.height=innerHeight*DPR;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(DPR,0,0,DPR,0,0)}sz();addEventListener('resize',sz);
  function burst(px,py,n){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=4+Math.random()*11;P.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,g:.16+Math.random()*.12,s:7+Math.random()*10,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,c:COL[(Math.random()*COL.length)|0],h:Math.random()<.4,l:0,m:120+Math.random()*60})}if(!raf)raf=requestAnimationFrame(tick)}
  function tick(){x.clearRect(0,0,innerWidth,innerHeight);for(var i=P.length-1;i>=0;i--){var p=P[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.995;p.r+=p.vr;p.l++;var a=Math.max(0,1-p.l/p.m);x.save();x.globalAlpha=a;x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;if(p.h){x.font=p.s*1.7+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('♥',0,0)}else x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();if(p.l>=p.m||p.y>innerHeight+40)P.splice(i,1)}if(P.length)raf=requestAnimationFrame(tick);else{raf=null;x.clearRect(0,0,innerWidth,innerHeight)}}
  var HL=document.getElementById('hearts'),EM=["❤️","💕","💖","💘","💗","🩷","😍","🥰","💞","💓"],ht=null;
  function heart(){var s=document.createElement('div');s.className='heart-b';s.textContent=EM[(Math.random()*EM.length)|0];s.style.left=(Math.random()*100)+'%';s.style.fontSize=(26+Math.random()*40)+'px';s.style.setProperty('--dur',(4.5+Math.random()*4)+'s');s.style.setProperty('--sway',(Math.random()*180-90)+'px');s.style.setProperty('--rot',(Math.random()*120-60)+'deg');HL.appendChild(s);s.addEventListener('animationend',function(){s.remove()})}
  function party(){burst(innerWidth/2,innerHeight*.4,170);setTimeout(function(){burst(innerWidth*.2,innerHeight*.5,80)},220);setTimeout(function(){burst(innerWidth*.8,innerHeight*.5,80)},420);for(var i=0;i<22;i++)setTimeout(heart,i*85);if(ht)clearInterval(ht);ht=setInterval(function(){heart();if(Math.random()<.5)heart()},300);setTimeout(function(){clearInterval(ht);ht=null},6500)}
  return{burst:burst,heart:heart,party:party}
})();

(function(){
  var load=document.getElementById('load'),res=document.getElementById('res');
  var bar=document.getElementById('bar'),pctEl=document.getElementById('pct'),statusEl=document.getElementById('status');
  var resPct=document.getElementById('resPct'),rmsg=document.getElementById('rmsg');
  var steps=[[0,"심장박동 분석 중… 💓"],[20,"눈빛 데이터 수집 중… 👀"],[40,"설렘 지수 계산 중… 🦋"],[60,"애정 호르몬 측정 중… 🧪"],[80,"결과 정리 중… 📊"],[93,"어라, 수치가 너무 높은데…? 😳"]];
  var finalMsgs=["사랑 넘침 감지됨 ❤️ (측정기 고장 아님 ㅎㅎ)","비정상 수치… 사랑이 넘쳐흐르는 중 💕","경고: 심장 두근거림 최대치 💓","분석 완료 — 결론은 '완전 사랑' 🥰"];
  var p=0, stalled=false, timer=null;

  function status(v){ for(var i=steps.length-1;i>=0;i--){ if(v>=steps[i][0]){ statusEl.textContent=steps[i][1]; break; } } }
  function set(v){ p=v; bar.style.width=v+'%'; pctEl.textContent=(Math.round(v*10)/10)+'%'; status(v); }

  function step(){
    if(p>=100){ finish(); return; }
    var inc = p<80 ? (0.8+Math.random()*1.7) : p<93 ? (0.25+Math.random()*0.5) : 0.12;
    set(Math.min(100,p+inc));
    if(!stalled && p>=93){ stalled=true; timer=setTimeout(step,1200); return; } // 극적인 멈칫
    var delay = p<80?28 : p<93?60 : 130;
    timer=setTimeout(step, delay);
  }
  function finish(){
    load.style.display='none'; res.classList.add('show');
    resPct.textContent='99.9%';
    rmsg.textContent = finalMsgs[(Math.random()*finalMsgs.length)|0];
    FX.party();
  }
  function start(){ stalled=false; p=0; set(0); res.classList.remove('show'); load.style.display='block'; if(timer)clearTimeout(timer); timer=setTimeout(step,400); }
  document.getElementById('again').addEventListener('click', start);
  start();
})();
</script>
