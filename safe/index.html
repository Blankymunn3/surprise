<style>
  /* 금고 */
  .safe-wrap{position:relative;width:100%;max-width:300px;margin:4px auto 18px}
  .safe{position:relative;z-index:2;width:100%;padding-bottom:92%;border-radius:22px;perspective:1000px;
    background:linear-gradient(160deg,#ffeaf2,#ffc7da 55%,#ffb0c9);
    border:3px solid rgba(255,255,255,.95);
    box-shadow:0 22px 46px -22px rgba(190,30,80,.55),inset 0 2px 0 rgba(255,255,255,.9)}
  .safe.shake{animation:shakeit .5s ease}
  @keyframes shakeit{
    0%,100%{transform:translateX(0) rotate(0)}
    15%{transform:translateX(-11px) rotate(-1.6deg)}
    30%{transform:translateX(10px) rotate(1.6deg)}
    45%{transform:translateX(-8px) rotate(-1deg)}
    60%{transform:translateX(6px) rotate(.8deg)}
    80%{transform:translateX(-3px) rotate(0)}
  }
  /* 내부 공간 */
  .cavity{position:absolute;left:9px;top:9px;right:9px;bottom:9px;border-radius:15px;overflow:hidden;
    background:linear-gradient(#8d4a63,#65293f);
    box-shadow:inset 0 8px 22px rgba(0,0,0,.45);display:grid;place-items:center}
  .inner{font-size:44px;opacity:0;transform:scale(.4);
    transition:opacity .4s ease .55s,transform .7s cubic-bezier(.16,1.2,.3,1) .55s}
  .safe-wrap.open .inner{opacity:1;transform:none}
  /* 금고 문 */
  .door{position:absolute;left:5px;top:5px;right:5px;bottom:5px;border-radius:18px;z-index:3;
    background:linear-gradient(150deg,#fff1f6,#ffd3e0 55%,#ffbdd0);
    border:2px solid rgba(255,255,255,.92);
    box-shadow:0 10px 22px -12px rgba(190,30,80,.55),inset 0 2px 0 rgba(255,255,255,.85);
    transform-origin:left center;transition:transform 1.05s cubic-bezier(.5,.02,.2,1)}
  .safe-wrap.open .door{transform:rotateY(-100deg)}
  .dial{position:absolute;left:50%;top:50%;width:38%;padding-bottom:38%;border-radius:50%;
    transform:translate(-50%,-50%);transition:transform 1.1s ease;
    background:radial-gradient(circle at 32% 28%,#fff,#ffd9e4 60%,#ff9fbb);
    border:3px solid rgba(255,255,255,.95);box-shadow:0 6px 14px -6px rgba(190,30,80,.6)}
  .safe-wrap.open .dial{transform:translate(-50%,-50%) rotate(540deg)}
  .mark{position:absolute;left:50%;top:7%;width:9%;height:26%;margin-left:-4.5%;border-radius:4px;
    background:var(--rose-deep);opacity:.7}
  .mark.m2{top:auto;bottom:7%;opacity:.35}
  .handle{position:absolute;right:7%;top:50%;width:9%;height:34%;margin-top:-17%;border-radius:8px;
    background:linear-gradient(#fff,#ffc2d6);border:2px solid rgba(255,255,255,.9);
    box-shadow:0 4px 10px -4px rgba(190,30,80,.6)}
  .bolt{position:absolute;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.9);
    box-shadow:inset 0 -1px 2px rgba(190,30,80,.4)}
  .bolt.b1{left:11px;top:11px}
  .bolt.b2{right:11px;top:11px}
  .bolt.b3{left:11px;bottom:11px}
  .bolt.b4{right:11px;bottom:11px}
  /* 금고에서 나오는 편지 */
  .paper{position:relative;z-index:1;width:94%;margin:-30px auto 0;overflow:hidden;
    background:linear-gradient(#fffdf7,#fff6ec);border:1px solid #f6dccb;border-radius:16px;
    box-shadow:0 18px 38px -20px rgba(190,30,80,.45);
    font-family:var(--font-hand);color:#6b3a28;text-align:left;
    max-height:0;opacity:0;padding:0 18px;transform:translateY(-18px);
    transition:max-height 1s ease .35s,opacity .6s ease .5s,padding .6s ease .35s,
      transform 1s cubic-bezier(.16,1.1,.3,1) .35s}
  .safe-wrap.open .paper{max-height:440px;opacity:1;padding:20px 18px;transform:none}
  .paper .ln{margin:0 0 8px;font-size:clamp(17px,4.5vw,20px);line-height:1.55}
  .paper .ln:last-child{margin-bottom:0}
  /* 입력창 */
  .disp{display:flex;justify-content:center;gap:10px;margin:0 0 14px}
  .cell{width:46px;height:56px;border-radius:13px;background:rgba(255,255,255,.85);
    border:2px solid #ffc2d6;display:grid;place-items:center;
    font-size:27px;color:var(--rose-deep);transition:transform .12s,border-color .2s}
  .cell.on{border-color:var(--rose);background:#fff;transform:translateY(-2px)}
  /* 키패드 */
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:300px;margin:0 auto}
  .pad.off{opacity:.45;pointer-events:none}
  .key{font-family:var(--font);border:none;cursor:pointer;border-radius:16px;padding:15px 0;
    font-size:26px;color:var(--rose-deep);background:rgba(255,255,255,.92);
    box-shadow:0 9px 18px -9px rgba(190,30,80,.55);transition:transform .1s}
  .key:active{transform:scale(.93)}
  .key:focus-visible{outline:3px solid var(--rose-deep);outline-offset:2px}
  .key.del{font-size:18px;background:rgba(255,255,255,.72)}
  .hintbox{display:none;margin:14px auto 0;width:100%;max-width:300px;
    font-family:var(--font-hand);font-size:16px;color:var(--rose-deep);
    background:rgba(255,255,255,.82);border-radius:14px;padding:11px 14px}
  .hintbox.show{display:block;animation:pop .4s ease both}
  #relock{display:none;margin-top:16px}
</style>

<script src="../assets/fx.js?v=3"></script>
<script>
(function(){
  /* ───────── 여기만 고치면 됩니다 ───────── */
  var CODE = "0412";  // ← 여기 숫자를 기념일로 바꾸세요 (숫자 4자리, 예: 결혼기념일이면 "0518")
  var HINT = "우리 기념일이야 💕";  // ← 3번 틀리면 보여줄 힌트 문구
  var LETTER = [        // ← 금고 안에서 나올 편지 본문 (한 줄씩)
    "자기야,",
    "이걸 열었다는 건 우리 기념일을 기억한다는 거지 😌",
    "고맙다는 말은 자꾸 아끼게 되는데,",
    "그래서 이렇게 금고 안에 몰래 넣어뒀어.",
    "오늘도 내 편이라서 든든해. 사랑해 💕"
  ];
  /* ────────────────────────────────────── */

  /* 참고: 이 페이지는 브라우저에서 그대로 읽히는 클라이언트 코드입니다.
     소스보기만 해도 비밀번호가 보이므로 실제 보안 장치가 아니고,
     어디까지나 서프라이즈/장난용 잠금입니다. 진짜 비밀은 여기 넣지 마세요. */

  // 주소창 파라미터로도 덮어쓰기 가능: 예) safe/?code=0101
  function param(name){
    var m = window.location.search.match(new RegExp("[?&]" + name + "=([^&#]*)"));
    return m ? decodeURIComponent(m[1]) : "";
  }
  var q = param("code");
  if (/^[0-9]{4}$/.test(q)) CODE = q;

  var wrap = document.getElementById('wrap');
  var safe = document.getElementById('safe');
  var paper = document.getElementById('paper');
  var disp = document.getElementById('disp');
  var pad = document.getElementById('pad');
  var hintbox = document.getElementById('hintbox');
  var note = document.getElementById('note');
  var relock = document.getElementById('relock');

  var entry = "", fails = 0, opened = false, busy = false;

  // 편지 본문 미리 심어두기 (문이 열릴 때 보임)
  var i, p;
  for (i = 0; i < LETTER.length; i++){
    p = document.createElement('p');
    p.className = 'ln';
    p.textContent = LETTER[i];
    paper.appendChild(p);
  }

  // 키패드 만들기
  var KEYS = ["1","2","3","4","5","6","7","8","9","","0","지우기"];
  for (i = 0; i < KEYS.length; i++){
    if (KEYS[i] === ""){
      var sp = document.createElement('div');
      pad.appendChild(sp);
      continue;
    }
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'key' + (KEYS[i] === "지우기" ? ' del' : '');
    b.textContent = KEYS[i];
    b.setAttribute('data-k', KEYS[i]);
    pad.appendChild(b);
  }

  function paint(){
    var cells = disp.children;
    for (var k = 0; k < 4; k++){
      cells[k].textContent = entry.charAt(k);
      cells[k].className = entry.length > k ? 'cell on' : 'cell';
    }
  }

  function press(k){
    if (opened || busy) return;
    if (k === "지우기"){
      entry = entry.slice(0, -1);
      note.textContent = '';
      paint();
      return;
    }
    if (entry.length >= 4) return;
    entry = entry + k;
    paint();
    if (entry.length === 4){
      busy = true;
      note.textContent = '철컥…';
      setTimeout(judge, 320);
    }
  }

  function judge(){
    if (entry === CODE) unlock();
    else wrong();
  }

  function wrong(){
    fails++;
    busy = false;
    note.textContent = '삐— 틀렸어 😝';
    safe.classList.add('shake');
    if (fails >= 3){
      hintbox.textContent = '힌트: ' + HINT;
      hintbox.classList.add('show');
    }
    setTimeout(function(){
      entry = "";
      paint();
    }, 520);
  }

  function unlock(){
    opened = true;
    busy = false;
    wrap.classList.add('open');
    pad.classList.add('off');
    note.textContent = '철컥— 열렸다! 🎉';
    setTimeout(function(){
      FX.party(6500);
      relock.style.display = 'inline-block';
    }, 900);
  }

  function reset(){
    opened = false;
    busy = false;
    entry = "";
    fails = 0;
    wrap.classList.remove('open');
    pad.classList.remove('off');
    hintbox.classList.remove('show');
    note.textContent = '';
    relock.style.display = 'none';
    paint();
  }

  pad.addEventListener('click', function(e){
    var t = e.target;
    if (!t || !t.getAttribute) return;
    var k = t.getAttribute('data-k');
    if (!k) return;
    press(k);
  });
  safe.addEventListener('animationend', function(){ safe.classList.remove('shake'); });
  relock.addEventListener('click', reset);
  document.addEventListener('keydown', function(e){
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('지우기');
  });

  paint();
})();
</script>
